name: Reconciliation diagnostics
on:
  pull_request:
permissions:
  contents: read
jobs:
  architecture-subtest:
    name: architecture / ${{ matrix.pattern }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        pattern:
          - canonical provider catalog hash
          - Status Contract v3 emitter
          - source adapter SDK
          - browser polling is isolated
          - production HTML carries
          - provider counts are derived
          - quality scripts and executable
          - CI uses current immutable
          - scheduled releases reuse
          - pinned pre-cascade-layer
          - reconciliation record explicitly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --import ./scripts/__tests__/test-clock.mjs --test --experimental-strip-types --test-name-pattern="${{ matrix.pattern }}" scripts/__tests__/architecture-reconciliation.test.js
