name: Reconciliation diagnostics
on:
  pull_request:
permissions:
  contents: read
jobs:
  combined-log:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Capture exact npm test output
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/npm-test.log
          status=${PIPESTATUS[0]}
          echo "$status" > /tmp/npm-test.exit
          exit "$status"
      - name: Upload combined test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reconciliation-npm-test-${{ github.sha }}
          path: |
            /tmp/npm-test.log
            /tmp/npm-test.exit
          if-no-files-found: error
          retention-days: 1
