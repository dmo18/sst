name: Reconciliation diagnostics
on:
  pull_request:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: files
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const output = [];
          function visit(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const target = path.join(directory, entry.name);
              if (entry.isDirectory()) visit(target);
              else if (/\.test\.(?:js|ts)$/.test(entry.name)) output.push(target.replaceAll('\\', '/'));
            }
          }
          visit('scripts/__tests__');
          visit('src/__tests__');
          output.sort();
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `files=${JSON.stringify(output)}\n`);
          console.log(`Discovered ${output.length} deterministic test files.`);
          NODE
  file-test:
    needs: discover
    name: ${{ matrix.file }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        file: ${{ fromJSON(needs.discover.outputs.files) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --import ./scripts/__tests__/test-clock.mjs --test --experimental-strip-types "${{ matrix.file }}"
