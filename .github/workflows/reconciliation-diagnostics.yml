name: Reconciliation diagnostics
on:
  pull_request:
permissions:
  contents: read
jobs:
  changed-contract-test:
    name: ${{ matrix.file }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        file:
          - scripts/__tests__/architecture-reconciliation.test.js
          - scripts/__tests__/final-public-health-hygiene.test.js
          - scripts/__tests__/pipeline-security.test.js
          - scripts/__tests__/production-core-boundary.test.js
          - scripts/__tests__/release-contract.test.js
          - scripts/__tests__/source-policy-hygiene.test.js
          - scripts/__tests__/source-reliability.test.js
          - scripts/__tests__/wallboard-runtime-contract.test.js
          - src/__tests__/payloadValidation.test.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --import ./scripts/__tests__/test-clock.mjs --test --experimental-strip-types "${{ matrix.file }}"
