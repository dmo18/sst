name: Reconciliation diagnostics
on:
  pull_request:
permissions:
  contents: read
jobs:
  combined-group:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: scripts-all
            command: scripts/__tests__/*.test.js
          - name: src-all
            command: src/__tests__/*.test.ts
          - name: scripts-a-m
            command: scripts/__tests__/{architecture-reconciliation,auth0-next-data,changelog,collection-intelligence,current-evidence-policy,deep-review-regressions,ensure-valid-status,entra-final-hygiene,entra-final-reliability,final-blindspot-repairs,final-public-health-conclusions,final-public-health-hygiene,full-review-source-adapters,incident-freshness,incident-identity,last-mile-hardening,maintenance-adapters,maintenance-identity}.test.js
          - name: scripts-n-z
            command: scripts/__tests__/{parsers,pipeline-security,producer-provenance,production-core-boundary,production-invariant-audit,production-smoke-identity,provider-source-parity,release-contract,repository-cleanup,source-intelligence,source-parity-regressions,source-parity-structured,source-policy-hygiene,source-reliability,structured-source-adapters,ultraHdVisual,wallboard-runtime-contract,wallboard-tv-detail}.test.js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run grouped deterministic tests
        shell: bash
        run: node --import ./scripts/__tests__/test-clock.mjs --test --experimental-strip-types ${{ matrix.command }}
