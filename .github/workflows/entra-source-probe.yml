name: Entra source probe

on:
  push:
    branches:
      - agent/entra-final-reliability
    paths:
      - .github/workflows/entra-source-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Entra status row in Azure public status page
        shell: bash
        run: |
          set -e
          node --input-type=module <<'NODE'
          const url = 'https://azure.status.microsoft/en-us/status';
          const started = Date.now();
          const response = await fetch(url, {
            signal: AbortSignal.timeout(15000),
            headers: { 'user-agent': 'msp-status-hud/3.3.0', accept: 'text/html' }
          });
          const html = await response.text();
          console.log(`status=${response.status} ms=${Date.now()-started} bytes=${Buffer.byteLength(html)}`);
          const patterns = ['Microsoft Entra ID', 'Azure Active Directory'];
          for (const pattern of patterns) {
            let cursor = 0;
            let count = 0;
            while (count < 12) {
              const index = html.toLowerCase().indexOf(pattern.toLowerCase(), cursor);
              if (index < 0) break;
              console.log(`\n=== ${pattern} occurrence ${count + 1} at ${index} ===`);
              console.log(html.slice(Math.max(0, index - 2500), Math.min(html.length, index + 3500)));
              cursor = index + pattern.length;
              count += 1;
            }
          }
          const currentImpactIndex = html.toLowerCase().indexOf('current impact');
          console.log(`\ncurrentImpactIndex=${currentImpactIndex}`);
          if (currentImpactIndex >= 0) console.log(html.slice(currentImpactIndex, currentImpactIndex + 12000));
          NODE
