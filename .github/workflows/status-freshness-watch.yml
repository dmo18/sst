name: Status Freshness Watch

on:
  schedule:
    - cron: "0,12,24,36,48 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: status-freshness-watch
  cancel-in-progress: false

jobs:
  verify-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for an active Pages release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const endpoint = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/refresh-pages.yml/runs?per_page=20`;
          const response = await fetch(endpoint, {
            headers: {
              accept: 'application/vnd.github+json',
              authorization: `Bearer ${process.env.GH_TOKEN}`,
              'x-github-api-version': '2022-11-28'
            }
          });
          if (!response.ok) throw new Error(`Unable to inspect release activity: HTTP ${response.status} ${await response.text()}`);

          const payload = await response.json();
          const activeStates = new Set(['queued', 'in_progress', 'waiting', 'requested', 'pending']);
          const activeRuns = (payload.workflow_runs || []).filter(run => activeStates.has(run.status));
          const active = activeRuns.length > 0;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `active=${active}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `active_count=${activeRuns.length}\n`);
          console.log(active
            ? `Release already active: ${activeRuns.map(run => `#${run.run_number}:${run.status}`).join(', ')}`
            : 'No queued or active Pages release.');
          NODE
      - name: Check deployed payload age
        id: freshness
        env:
          STATUS_URL: https://dmo18.github.io/sst/status.json
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(`${process.env.STATUS_URL}?watch=${Date.now()}`, { cache: 'no-store' });
          if (!response.ok) throw new Error(`status.json returned HTTP ${response.status}`);
          const payload = await response.json();
          const generatedAt = Date.parse(payload.generated_at || '');
          if (!Number.isFinite(generatedAt)) throw new Error('status.json generated_at is invalid');
          const ageMinutes = Math.floor((Date.now() - generatedAt) / 60000);
          console.log(`Deployed payload age: ${ageMinutes} minutes`);
          const stale = ageMinutes > 20;
          await import('node:fs').then(({ appendFileSync }) => {
            appendFileSync(process.env.GITHUB_OUTPUT, `stale=${stale}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `age_minutes=${ageMinutes}\n`);
          });
          NODE
      - name: Defer recovery while a release is active
        if: steps.freshness.outputs.stale == 'true' && steps.release.outputs.active == 'true'
        run: echo "Payload is stale, but ${{ steps.release.outputs.active_count }} release run(s) are already queued or active. Recovery dispatch deferred."
      - name: Dispatch one recovery refresh
        if: steps.freshness.outputs.stale == 'true' && steps.release.outputs.active != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AGE_MINUTES: ${{ steps.freshness.outputs.age_minutes }}
        run: |
          echo "Payload is ${AGE_MINUTES} minutes old and no release is active. Dispatching one recovery refresh."
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/refresh-pages.yml/dispatches \
            --data '{"ref":"main"}'
