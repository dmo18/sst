name: Status Freshness Watch

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  # `repository_dispatch` is a repository API write, while `actions: write`
  # is limited to cancelling an already-wedged Pages run.
  contents: write
  actions: write

concurrency:
  group: status-freshness-watch
  cancel-in-progress: false

jobs:
  verify-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout watcher code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Check for an active Pages release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const endpoint = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/refresh-pages.yml/runs?per_page=20`;
          const response = await fetch(endpoint, {
            headers: {
              accept: 'application/vnd.github+json',
              authorization: `Bearer ${process.env.GH_TOKEN}`,
              'x-github-api-version': '2022-11-28'
            }
          });
          if (!response.ok) throw new Error(`Unable to inspect release activity: HTTP ${response.status} ${await response.text()}`);

          const payload = await response.json();
          const activeStates = new Set(['queued', 'in_progress', 'waiting', 'requested', 'pending']);
          const activeRuns = (payload.workflow_runs || []).filter(run => activeStates.has(run.status));
          const now = Date.now();
          // A release may legitimately run for its two 20 minute job budgets. Only
          // a run older than that is wedged and may be taken over.
          const takeoverAfterMinutes = 45;
          // A run that has not started within this time is stuck in the queue. It
          // has nothing to interrupt, so it is replaced much sooner.
          const queuedTakeoverAfterMinutes = 12;
          const takeoverThreshold = run => run.status === 'in_progress' ? takeoverAfterMinutes : queuedTakeoverAfterMinutes;
          // Never start a release sooner than this after the previous one began.
          const minReleaseSpacingMinutes = 9;
          const runAgeMinutes = run => {
            const started = Date.parse(run.run_started_at || run.created_at || '');
            return Number.isFinite(started) ? Math.max(0, Math.floor((now - started) / 60_000)) : Number.POSITIVE_INFINITY;
          };
          const staleRuns = activeRuns.filter(run => runAgeMinutes(run) >= takeoverThreshold(run));
          const oldestAge = activeRuns.length ? Math.max(...activeRuns.map(runAgeMinutes)) : 0;
          const active = activeRuns.length > 0;

          const newestReleaseStart = Math.max(0, ...(payload.workflow_runs || [])
            .map(run => Date.parse(run.run_started_at || run.created_at || ''))
            .filter(Number.isFinite));
          const minutesSinceRelease = newestReleaseStart ? (now - newestReleaseStart) / 60_000 : Number.POSITIVE_INFINITY;
          const recent = minutesSinceRelease < minReleaseSpacingMinutes;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `recent=${recent}\n`);
          if (recent) console.log(`Last release started ${minutesSinceRelease.toFixed(1)}m ago; inside the ${minReleaseSpacingMinutes}m spacing.`);

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `active=${active}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `active_count=${activeRuns.length}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `oldest_age_minutes=${Number.isFinite(oldestAge) ? oldestAge : 9999}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `stale_active=${staleRuns.length > 0}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `stale_ids=${staleRuns.map(run => run.id).join(',')}\n`);

          if (!active) {
            console.log('No queued or active Pages release.');
          }
          else {
            console.log(`Active release(s): ${activeRuns.map(run => `#${run.run_number}:${run.status}:${runAgeMinutes(run)}m`).join(', ')}`);
            if (staleRuns.length) console.warn(`Wedged release takeover (${queuedTakeoverAfterMinutes}m unstarted, ${takeoverAfterMinutes}m running): ${staleRuns.map(run => `#${run.run_number}`).join(', ')}`);
          }
          NODE

      - name: Compare deployed state with live official structured truth
        id: truth
        env:
          STATUS_URL: https://dmo18.github.io/sst/status.json
        run: node scripts/status-truth-watch.mjs

      - name: Defer recovery while a healthy-age release is active
        if: (steps.truth.outputs.stale == 'true' || steps.truth.outputs.drift == 'true') && steps.release.outputs.active == 'true' && steps.release.outputs.stale_active != 'true'
        run: |
          echo "Recovery condition exists, but ${{ steps.release.outputs.active_count }} release run(s) are already queued or active and still inside the takeover window."
          echo "Payload age: ${{ steps.truth.outputs.age_minutes }} minutes; live truth drift count: ${{ steps.truth.outputs.drift_count }}; oldest release: ${{ steps.release.outputs.oldest_age_minutes }} minutes."

      - name: Cancel wedged Pages releases
        if: (steps.truth.outputs.stale == 'true' || steps.truth.outputs.drift == 'true') && steps.release.outputs.stale_active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_IDS: ${{ steps.release.outputs.stale_ids }}
        run: |
          IFS=',' read -ra run_ids <<< "${STALE_IDS}"
          for id in "${run_ids[@]}"; do
            test -n "${id}" || continue
            echo "Cancelling wedged Pages release ${id}."
            curl --fail-with-body --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" \
              || echo "Release ${id} could not be cancelled, likely because it already completed."
          done

      - name: Dispatch one recovery refresh
        if: (steps.truth.outputs.stale == 'true' || steps.truth.outputs.drift == 'true') && steps.release.outputs.recent != 'true' && (steps.release.outputs.active != 'true' || steps.release.outputs.stale_active == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          AGE_MINUTES: ${{ steps.truth.outputs.age_minutes }}
          DRIFT_COUNT: ${{ steps.truth.outputs.drift_count }}
        run: |
          echo "Payload age=${AGE_MINUTES}m, live truth drift=${DRIFT_COUNT}. Dispatching one recovery refresh."
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches \
            --data '{"event_type":"freshness-recovery","client_payload":{"source":"status-freshness-watch"}}'
