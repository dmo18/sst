name: Status Freshness Watch

on:
  schedule:
    - cron: "8,18,28,38,48,58 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: status-freshness-watch
  cancel-in-progress: false

jobs:
  verify-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout watcher code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Check for an active Pages release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const endpoint = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/refresh-pages.yml/runs?per_page=20`;
          const response = await fetch(endpoint, {
            headers: {
              accept: 'application/vnd.github+json',
              authorization: `Bearer ${process.env.GH_TOKEN}`,
              'x-github-api-version': '2022-11-28'
            }
          });
          if (!response.ok) throw new Error(`Unable to inspect release activity: HTTP ${response.status} ${await response.text()}`);

          const payload = await response.json();
          const activeStates = new Set(['queued', 'in_progress', 'waiting', 'requested', 'pending']);
          const activeRuns = (payload.workflow_runs || []).filter(run => activeStates.has(run.status));
          const active = activeRuns.length > 0;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `active=${active}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `active_count=${activeRuns.length}\n`);
          console.log(active
            ? `Release already active: ${activeRuns.map(run => `#${run.run_number}:${run.status}`).join(', ')}`
            : 'No queued or active Pages release.');
          NODE

      - name: Compare deployed state with live official structured truth
        id: truth
        env:
          STATUS_URL: https://dmo18.github.io/sst/status.json
        run: node scripts/status-truth-watch.mjs

      - name: Defer recovery while a release is active
        if: (steps.truth.outputs.stale == 'true' || steps.truth.outputs.drift == 'true') && steps.release.outputs.active == 'true'
        run: |
          echo "Recovery condition exists, but ${{ steps.release.outputs.active_count }} release run(s) are already queued or active. Dispatch deferred."
          echo "Payload age: ${{ steps.truth.outputs.age_minutes }} minutes; live truth drift count: ${{ steps.truth.outputs.drift_count }}."

      - name: Dispatch one recovery refresh
        if: (steps.truth.outputs.stale == 'true' || steps.truth.outputs.drift == 'true') && steps.release.outputs.active != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AGE_MINUTES: ${{ steps.truth.outputs.age_minutes }}
          DRIFT_COUNT: ${{ steps.truth.outputs.drift_count }}
        run: |
          echo "Payload age=${AGE_MINUTES}m, live truth drift=${DRIFT_COUNT}, no release active. Dispatching one recovery refresh."
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/refresh-pages.yml/dispatches \
            --data '{"ref":"main"}'
