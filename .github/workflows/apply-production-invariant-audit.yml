name: Apply production invariant audit

on:
  push:
    branches:
      - agent/production-invariant-audit
    paths:
      - .github/workflows/apply-production-invariant-audit.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-invariant-audit
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/apply-production-invariant-audit.mjs
      - run: npm ci
      - run: npm run validate-providers
      - run: npm test
      - run: npm run typecheck
      - name: Commit repaired production code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/region-scope.mjs scripts/source-intelligence.mjs scripts/update-public-status.mjs scripts/collection-intelligence.mjs scripts/structured-source-adapters.mjs scripts/ensure-valid-status.mjs
          if git diff --cached --quiet; then
            echo "No invariant repair diff to commit."
            exit 0
          fi
          git commit -m "Enforce production status invariants"
          git push origin HEAD:agent/production-invariant-audit
