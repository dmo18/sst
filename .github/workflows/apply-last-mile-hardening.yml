name: Apply last-mile provider hardening

on:
  push:
    branches:
      - agent/final-public-health-conclusions
    paths:
      - .github/workflows/apply-last-mile-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-public-health-conclusions
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/apply-last-mile-hardening.mjs
      - run: npm ci
      - run: npm run validate-providers
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:app
      - run: npm audit --omit=dev --audit-level=high
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/structured-source-adapters.mjs scripts/update-public-status.mjs scripts/full-review-source-adapters.mjs scripts/region-scope.mjs scripts/__tests__/last-mile-hardening.test.js
          git commit -m "Harden provider truth and region semantics"
          git push origin HEAD:agent/final-public-health-conclusions
