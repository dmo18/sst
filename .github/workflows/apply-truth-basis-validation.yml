name: Apply truth basis validation

on:
  push:
    branches:
      - agent/production-invariant-audit
    paths:
      - .github/workflows/apply-truth-basis-validation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-invariant-audit
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/apply-truth-basis-validation.mjs
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Commit validator repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update-status.mjs
          git commit -m "Validate component truth bases"
          git push origin HEAD:agent/production-invariant-audit
