name: Public health probe

on:
  push:
    branches:
      - agent/final-public-health-conclusions
    paths:
      - .github/workflows/public-health-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Probe current Stripe Statuspage API
        shell: bash
        run: |
          set -e
          for url in \
            'https://www.stripestatus.com/api/v2/summary.json' \
            'https://www.stripestatus.com/api/v2/status.json' \
            'https://www.stripestatus.com/api/v2/components.json' \
            'https://www.stripestatus.com/api/v2/incidents/unresolved.json'; do
            echo "=== ${url} ==="
            curl -L -sS --max-time 15 -A 'msp-status-hud/3.3.0' -D /tmp/h -o /tmp/b "$url"
            grep -Ei '^(HTTP/|content-type:|content-length:|location:)' /tmp/h | tail -n 8
            echo "bytes=$(wc -c < /tmp/b)"
            head -c 14000 /tmp/b
            echo
          done

      - name: Inspect PayPal application data paths
        shell: bash
        run: |
          set -e
          curl -L -sS --max-time 15 -A 'Mozilla/5.0' 'https://www.paypal-status.com/bundle.js' -o /tmp/paypal.js
          echo "bundle_bytes=$(wc -c < /tmp/paypal.js)"
          grep -Eo '.{0,220}(fetch\(|axios|/api/|/status|/product|/incident|operational|degrad|outage|production).{0,420}' /tmp/paypal.js | head -n 140 || true

      - name: Render PayPal production status
        shell: bash
        run: |
          set +e
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          timeout 32s "$BROWSER" \
            --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage \
            --user-data-dir=/tmp/paypal-production \
            --virtual-time-budget=18000 \
            --dump-dom 'https://www.paypal-status.com/product/production' > /tmp/paypal.html 2> /tmp/paypal.err
          echo "exit=$? bytes=$(wc -c < /tmp/paypal.html)"
          tail -n 12 /tmp/paypal.err
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('/tmp/paypal.html','utf8');
          const text = html
            .replace(/<script[\s\S]*?<\/script>/gi,' ')
            .replace(/<style[\s\S]*?<\/style>/gi,' ')
            .replace(/<svg[\s\S]*?<\/svg>/gi,' ')
            .replace(/<[^>]+>/g,' ')
            .replace(/&nbsp;|&#160;/gi,' ')
            .replace(/&amp;/gi,'&')
            .replace(/\s+/g,' ')
            .trim();
          console.log(text.slice(0,20000));
          NODE
