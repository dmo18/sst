name: Diagnose Pages publication (temporary, read-only)

# Temporary diagnostic. Runs only for pushes to the diagnostic branch, never on main.
# It reads Pages and deployment records and the live site. It writes nothing and
# does not deploy. Remove this file after the cause is confirmed.
on:
  push:
    branches: [ccr-043a557d-eds8kl]
    paths:
      - .github/workflows/diagnose-pages.yml

permissions:
  contents: read
  pages: read
  deployments: read
  actions: read

concurrency:
  group: diagnose-pages
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: 45dca8ad6f3e4b3061e9508d9c60523b6133781f
    steps:
      - name: Pages site configuration
        run: |
          echo "== GET /pages =="
          gh api "repos/$REPO/pages" --jq '{build_type, status, source, html_url, https_enforced, public, custom_404}' || echo "FAILED (see error above)"

      - name: Pages deployment record for the main commit
        run: |
          echo "== GET /pages/deployments/$SHA =="
          gh api "repos/$REPO/pages/deployments/$SHA" || echo "FAILED (see error above)"

      - name: Recent github-pages deployments and their statuses
        run: |
          echo "== GET /deployments?environment=github-pages =="
          gh api "repos/$REPO/deployments?environment=github-pages&per_page=100" > /tmp/deployments.json || { echo "FAILED"; exit 0; }
          jq -r 'length as $n | "first page count: \($n)", "newest: \(.[0].created_at)", "oldest on page: \(.[-1].created_at)"' /tmp/deployments.json
          echo "-- newest 8 deployments --"
          jq -r '.[0:8][] | "\(.id) sha=\(.sha[0:7]) ref=\(.ref[0:12]) task=\(.task) created=\(.created_at) updated=\(.updated_at)"' /tmp/deployments.json
          echo "-- distinct shas on this page --"
          jq -r '[.[].sha[0:7]] | group_by(.) | map("\(.[0]) x\(length)") | .[]' /tmp/deployments.json
          for id in $(jq -r '.[0:8][].id' /tmp/deployments.json); do
            echo "-- statuses for deployment $id --"
            gh api "repos/$REPO/deployments/$id/statuses?per_page=10" --jq '.[] | "\(.created_at) state=\(.state) desc=\(.description // "-") env_url=\(.environment_url // "-")"' || echo "FAILED"
          done

      - name: Latest legacy Pages build record
        run: |
          echo "== GET /pages/builds/latest =="
          gh api "repos/$REPO/pages/builds/latest" || echo "FAILED (see error above)"

      - name: What the live site serves right now
        run: |
          base=https://dmo18.github.io/sst
          echo "== deploy-version.txt =="
          curl -sS -D /tmp/h.txt -o /tmp/dv.txt --max-time 20 "$base/deploy-version.txt?diag=$RANDOM" || true
          cat /tmp/dv.txt; echo
          echo "-- response headers --"
          grep -iE '^(HTTP|last-modified|etag|age|x-served-by|x-cache|via|x-github-request-id|cache-control|date)' /tmp/h.txt || true
          echo "== status.json generated_at =="
          curl -sS --max-time 30 "$base/status.json?diag=$RANDOM" | jq -r '"generated_at=\(.generated_at) providers=\(.providers|length) incidents=\(.incidents|length)"' || true
          echo "== fresh build artifact from main for comparison =="
          gh api "repos/$REPO/actions/artifacts?name=github-pages&per_page=3" --jq '.artifacts[] | "\(.id) created=\(.created_at) expired=\(.expired) run=\(.workflow_run.id)"' || true
