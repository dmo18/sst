name: Stale evidence hotfix validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize patch release and deterministic fixtures
        run: |
          npm version 3.3.1 --no-git-tag-version
          python - <<'PY'
          from pathlib import Path
          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          heading = '## [3.3.1] - 2026-08-02\n\n'
          if heading not in text:
              marker = text.find('## [')
              entry = heading + '- Tightened current-incident evidence from 45 days to 72 hours across structured, feed, HTML, and provider-specific adapters.\n- Suppressed unresolved records whose newest official vendor update is older than 72 hours; providers fail closed to limited/unknown instead of remaining degraded.\n- Added global US-scope rejection for Bahrain, Manama, AWS `me-south-1`, AWS `me-central-1`, and other explicit non-US regions.\n- Prevented adjacent HTML incidents from borrowing each other\'s timestamps.\n- Added regressions for the stale KnowBe4 monitoring record and the Elastic Cloud AWS Bahrain incident.\n\n'
              text = text[:marker] + entry + text[marker:]
              changelog.write_text(text)

          replacements = {
              'scripts/__tests__/structured-source-adapters.test.js': [
                  ('July 20, 2026 9:36AM EDT', 'August 2, 2026 8:36AM EDT'),
                  ('/^2026-07-20T/', '/^2026-08-02T/')
              ],
              'scripts/__tests__/update-public-status.test.js': [
                  ('Jul 31, 2026 - 16:20 UTC', 'Aug 2, 2026 - 12:20 UTC'),
                  ('Jul 31, 2026 - 16:00 UTC', 'Aug 2, 2026 - 12:00 UTC')
              ]
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              value = path.read_text()
              for old, new in pairs:
                  value = value.replace(old, new)
              path.write_text(value)

          parser = Path('scripts/incident-detail-repairs.mjs')
          value = parser.read_text()
          old = """    for (let cursor = index - 1; cursor >= Math.max(0, index - 6); cursor -= 1) {
      if (DATE_LINE.test(current[cursor])) { time = isoDate(current[cursor]); break; }
      if (STATUS_LINE.test(current[cursor])) break;
    }
"""
          new = """    for (let cursor = index - 1; cursor >= Math.max(0, index - 6); cursor -= 1) {
      if (DATE_LINE.test(current[cursor])) { time = isoDate(current[cursor]); break; }
      if (STATUS_LINE.test(current[cursor]) || meaningfulTitle(current[cursor])) break;
    }
"""
          if old not in value and new not in value:
              raise SystemExit('Expected adjacent-incident timestamp block was not found')
          parser.write_text(value.replace(old, new))
          PY
      - run: npm ci
      - run: npm run validate-providers
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:app
      - name: Generate current first-party payload
        run: npm run update-status
      - name: Reject stale and non-US active records
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { incidentEvidenceIsCurrent } from './scripts/incident-freshness.mjs';
          const payload = JSON.parse(fs.readFileSync('public/status.json', 'utf8'));
          const bad = (payload.incidents || []).filter(item => !incidentEvidenceIsCurrent(item, Date.now(), undefined, { requireTimestamp: true }));
          if (bad.length) {
            console.error('Stale or out-of-scope records:', JSON.stringify(bad.map(({ provider, title, latest_update, affected_service }) => ({ provider, title, latest_update, affected_service })), null, 2));
            process.exit(1);
          }
          const named = (payload.incidents || []).filter(item => /\b(?:knowbe4|bahrain|manama|me-south-1|me-central-1)\b/i.test(`${item.provider || ''} ${item.title || ''} ${item.note || ''} ${item.affected_service || ''}`));
          if (named.length) {
            console.error('Reported regressions remained:', JSON.stringify(named, null, 2));
            process.exit(1);
          }
          console.log(`Validated ${payload.incidents.length} current US-relevant incidents.`);
          NODE
      - name: Commit synchronized release files
        run: |
          if ! git diff --quiet -- package.json package-lock.json CHANGELOG.md scripts/incident-detail-repairs.mjs scripts/__tests__/structured-source-adapters.test.js scripts/__tests__/update-public-status.test.js; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add package.json package-lock.json CHANGELOG.md scripts/incident-detail-repairs.mjs scripts/__tests__/structured-source-adapters.test.js scripts/__tests__/update-public-status.test.js
            git commit -m 'Synchronize 3.3.1 release and incident boundaries'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
