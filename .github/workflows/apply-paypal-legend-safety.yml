name: Apply PayPal legend safety

on:
  push:
    branches:
      - agent/final-public-health-conclusions
    paths:
      - .github/workflows/apply-paypal-legend-safety.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-public-health-conclusions
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/apply-paypal-legend-safety.mjs
      - run: npm ci
      - run: npm test
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/full-review-source-adapters.mjs
          if git diff --cached --quiet; then
            echo "No safety diff to commit."
            exit 0
          fi
          git commit -m "Ignore PayPal status legend when deriving service impact"
          git push origin HEAD:agent/final-public-health-conclusions
