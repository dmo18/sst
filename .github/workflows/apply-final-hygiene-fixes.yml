name: Apply final source hygiene repairs

on:
  push:
    branches:
      - agent/final-public-health-conclusions
    paths:
      - .github/workflows/apply-final-hygiene-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-public-health-conclusions
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/apply-final-hygiene-fixes.mjs
      - run: npm ci
      - run: npm run validate-providers
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:app
      - run: npm audit --omit=dev --audit-level=high
      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update-public-status.mjs scripts/public-source-repairs.mjs scripts/__tests__/deep-review-regressions.test.js scripts/__tests__/final-public-health-hygiene.test.js
          git commit -m "Remove stale provider policy paths"
          git push origin HEAD:agent/final-public-health-conclusions

# Retry after fixing canonical UK scope and deferring temporary-tool guard until cleanup.
