name: Temporary public source probe
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe free first-party sources
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const candidates = {
            crowdstrike: ['https://status.crowdstrike.com/'],
            ringcentral: ['https://status.ringcentral.com/'],
            sophos: ['https://sophoscentral.status.page/', 'https://sophoscentral.status.page/state_feed/feed.atom'],
            bitdefender: ['https://ssems.gravityzone.bitdefender.com/', 'https://ssems.gravityzone.bitdefender.com/history.rss', 'https://ssems.gravityzone.bitdefender.com/history.atom'],
            bitwarden: ['https://status.bitwarden.com/', 'https://status.bitwarden.com/state_feed/feed.atom'],
            cove: ['https://uptime.n-able.com/'],
            crashplan: ['https://status.crashplan.com/', 'https://status.crashplan.com/history.rss', 'https://status.crashplan.com/history.atom'],
            fortinet: ['https://status.forticloud.com/', 'https://status.forticloud.com/history.rss', 'https://status.forticloud.com/history.atom'],
            keeper: ['https://statuspage.keeper.io/', 'https://statuspage.keeper.io/history.rss', 'https://statuspage.keeper.io/history.atom'],
            malwarebytes: ['https://malwarebytes.status.page/', 'https://malwarebytes.status.page/state_feed/feed.atom'],
            proofpoint: ['https://status.proofpoint.com/', 'https://proofpoint.statuspage.io/', 'https://proofpoint.statuspage.io/history.rss'],
            superops: ['https://status.superops.com/'],
            syncro: ['https://www.syncrostatus.com/', 'https://www.syncrostatus.com/state_feed/feed.atom'],
            eightx8: ['https://status.8x8.com/', 'https://status.8x8.com/history.rss', 'https://status.8x8.com/history.atom'],
            intermedia: ['https://status.intermedia.net/', 'https://status.intermedia.com/', 'https://status.intermedia.net/history.rss'],
            salesforce: ['https://status.salesforce.com/current', 'https://status.salesforce.com/products/Salesforce_Services'],
            vultr: ['https://status.vultr.com/', 'https://status.vultr.com/history.rss', 'https://status.vultr.com/history.atom'],
            zendesk: ['https://status.zendesk.com/', 'https://status.zendesk.com/history.rss', 'https://status.zendesk.com/history.atom'],
            backblaze: ['https://status.backblaze.com/', 'https://status.backblaze.com/state_feed/feed.atom']
          };

          const phrases = /all systems operational|all systems normal|all systems are go|operating normally|all services are online|no issues are being reported|no active incidents|no incidents with zendesk|current status available|operational|degraded|outage|incident|normal/gi;
          const feedPattern = /(?:href|src)=["']([^"']*(?:rss|atom|feed)[^"']*)["']/gi;
          const results = {};

          async function probe(url) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 15000);
            try {
              const response = await fetch(url, {
                signal: controller.signal,
                redirect: 'follow',
                headers: {
                  accept: 'text/html,application/rss+xml,application/atom+xml,application/xml,text/xml,text/plain,*/*',
                  'user-agent': 'Mozilla/5.0 (compatible; MSPStatusHUD/2.3.6; +https://github.com/dmo18/sst)'
                }
              });
              const body = await response.text();
              const title = /<title[^>]*>([\s\S]*?)<\/title>/i.exec(body)?.[1]?.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim() || '';
              const matches = [...new Set((body.match(phrases) || []).map(value => value.toLowerCase()))].slice(0, 20);
              const feeds = [];
              for (const match of body.matchAll(feedPattern)) {
                try {
                  const resolved = new URL(match[1], response.url).href;
                  if (!feeds.includes(resolved)) feeds.push(resolved);
                } catch {}
              }
              return {
                requested_url: url,
                final_url: response.url,
                status: response.status,
                ok: response.ok,
                content_type: response.headers.get('content-type') || '',
                bytes: new TextEncoder().encode(body).byteLength,
                title,
                phrases: matches,
                feeds: feeds.slice(0, 12),
                starts_with: body.slice(0, 300).replace(/\s+/g, ' ')
              };
            } catch (error) {
              return { requested_url: url, ok: false, error: String(error?.message || error) };
            } finally {
              clearTimeout(timer);
            }
          }

          for (const [provider, urls] of Object.entries(candidates)) {
            results[provider] = [];
            for (const url of urls) results[provider].push(await probe(url));
          }

          fs.writeFileSync('source-probe.json', `${JSON.stringify(results, null, 2)}\n`);
          console.log(JSON.stringify(results, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: source-probe
          path: source-probe.json
