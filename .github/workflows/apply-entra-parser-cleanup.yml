name: Apply Entra parser cleanup

on:
  push:
    branches:
      - agent/entra-final-reliability
    paths:
      - .github/workflows/apply-entra-parser-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/entra-final-reliability
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply parser cleanup
        run: node scripts/apply-entra-parser-cleanup.mjs
      - name: Syntax check
        run: node --check scripts/update-public-status.mjs && node --check scripts/entra-status-adapter.mjs
      - name: Commit parser cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update-public-status.mjs
          if git diff --cached --quiet; then
            echo "No parser cleanup diff to commit."
            exit 0
          fi
          git commit -m "Use deterministic adapter for Entra Azure status"
          git push origin HEAD:agent/entra-final-reliability
