name: Apply provider coverage release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply verified provider coverage display
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function replaceOnce(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            const occurrences = source.split(before).length - 1;
            if (occurrences !== 1) throw new Error(`${path}: expected one replacement target, found ${occurrences}`);
            fs.writeFileSync(path, source.replace(before, after));
          }

          function replaceAllChecked(path, before, after, expected) {
            const source = fs.readFileSync(path, 'utf8');
            const occurrences = source.split(before).length - 1;
            if (occurrences !== expected) throw new Error(`${path}: expected ${expected} replacement targets, found ${occurrences}`);
            fs.writeFileSync(path, source.replaceAll(before, after));
          }

          replaceOnce(
            'src/types.ts',
            `    coverage_percent: number;\n    confirmed_operational_percent: number;`,
            `    coverage_percent: number;\n    valid_status_count?: number;\n    invalid_status_count?: number;\n    valid_status_percent?: number;\n    confirmed_operational_percent: number;`
          );

          replaceAllChecked(
            'src/IssueConsole.tsx',
            `model.summary.coverage_percent`,
            `(model.summary.valid_status_percent ?? model.summary.coverage_percent)`,
            3
          );

          replaceOnce(
            'src/IssueConsole.tsx',
            `<p>No-incident conclusions apply only to {model.summary.confirmed_operational_count} confirmed sources, never unchecked providers.</p>`,
            `<p>Provider record coverage is {model.summary.valid_status_count ?? model.summary.enabled_provider_count} of {model.summary.provider_total}. Live machine-readable source access is {model.summary.coverage_percent}%. Limited sources remain unknown and are never shown as operational.</p>`
          );

          replaceAllChecked(
            'src/Wallboard.tsx',
            `model?.summary.coverage_percent ?? 0`,
            `model?.summary.valid_status_percent ?? model?.summary.coverage_percent ?? 0`,
            2
          );

          replaceOnce(
            'src/Wallboard.tsx',
            `<article><span>Coverage</span><b>{model.summary.coverage_percent}%</b></article>`,
            `<article><span>Provider coverage</span><b>{model.summary.valid_status_percent ?? model.summary.coverage_percent}%</b></article>`
          );
          NODE

      - name: Bump version to 2.2.0
        run: npm version 2.2.0 --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: Validate release
        run: |
          npm run validate-providers
          npm test
          npm run typecheck
          npm run build:app

      - name: Commit release changes
        shell: bash
        run: |
          rm .github/workflows/apply-provider-coverage-release.yml
          rm .github/provider-coverage-release-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json src/types.ts src/IssueConsole.tsx src/Wallboard.tsx .github/workflows/apply-provider-coverage-release.yml .github/provider-coverage-release-trigger
          git commit -m "Release 2.2.0 with complete provider coverage"
          git push origin HEAD:main
