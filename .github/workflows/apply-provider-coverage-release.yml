name: Finish provider coverage release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Show verified provider coverage in all views
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function replaceOnce(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            const occurrences = source.split(before).length - 1;
            if (occurrences !== 1) throw new Error(`${path}: expected one replacement target, found ${occurrences}`);
            fs.writeFileSync(path, source.replace(before, after));
          }

          function replaceAllChecked(path, before, after, expected) {
            const source = fs.readFileSync(path, 'utf8');
            const occurrences = source.split(before).length - 1;
            if (occurrences !== expected) throw new Error(`${path}: expected ${expected} replacement targets, found ${occurrences}`);
            fs.writeFileSync(path, source.replaceAll(before, after));
          }

          replaceAllChecked(
            'src/IssueConsole.tsx',
            `model.summary.coverage_percent`,
            `model.summary.valid_status_percent`,
            3
          );

          replaceOnce(
            'src/IssueConsole.tsx',
            `<p>No-incident conclusions apply only to {model.summary.confirmed_operational_count} confirmed sources, never unchecked providers.</p>`,
            `<p>Provider record coverage is {model.summary.valid_status_count} of {model.summary.provider_total}. Live machine-readable source access is {model.summary.live_source_coverage_percent}%. Limited sources remain unknown and are never shown as operational.</p>`
          );

          replaceOnce(
            'src/Wallboard.tsx',
            `model?.summary.coverage_percent ?? 0`,
            `model?.summary.valid_status_percent ?? 0`
          );

          replaceOnce(
            'src/Wallboard.tsx',
            `<article><span>Coverage</span><b>{model.summary.coverage_percent}%</b></article>`,
            `<article><span>Provider coverage</span><b>{model.summary.valid_status_percent}%</b></article>`
          );
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Validate version 2.2.0
        run: |
          node -e "const p=require('./package.json'); if(p.version!=='2.2.0') throw new Error('Expected version 2.2.0')"
          npm run validate-providers
          npm test
          npm run typecheck
          npm run build:app

      - name: Commit validated UI release
        shell: bash
        run: |
          rm .github/workflows/apply-provider-coverage-release.yml
          rm .github/provider-coverage-release-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/IssueConsole.tsx src/Wallboard.tsx .github/workflows/apply-provider-coverage-release.yml .github/provider-coverage-release-trigger
          git commit -m "Complete 2.2.0 provider coverage display"
          git push origin HEAD:main
