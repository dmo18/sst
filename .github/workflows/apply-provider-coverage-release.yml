name: Apply provider coverage release

on:
  push:
    branches:
      - agent/provider-coverage-100

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/provider-coverage-100
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply coverage semantics and tests
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function replaceOnce(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            const occurrences = source.split(before).length - 1;
            if (occurrences !== 1) throw new Error(`${path}: expected one replacement target, found ${occurrences}`);
            fs.writeFileSync(path, source.replace(before, after));
          }

          replaceOnce('scripts/ensure-valid-status.mjs', `  return normalized;\n}`, `  const liveSourceCoveragePercent = normalized.summary.coverage_percent;\n  return {\n    ...normalized,\n    summary: {\n      ...normalized.summary,\n      coverage_percent: normalized.summary.valid_status_percent,\n      live_source_coverage_percent: liveSourceCoveragePercent\n    },\n    status_data_policy: {\n      ...normalized.status_data_policy,\n      coverage_definition: 'coverage_percent is the percentage of providers with valid status records; live_source_coverage_percent is the percentage with machine-readable live official sources.'\n    }\n  };\n}`);
          replaceOnce('src/types.ts', `    download_log?: ProviderDownloadLog[];\n}`, `    download_log?: ProviderDownloadLog[];\n    status_data_valid?: boolean;\n    status_data_basis?: 'live-official' | 'last-known-official' | 'limited-official' | 'limited-fallback';\n}`);
          replaceOnce('src/types.ts', `    coverage_percent: number;\n    confirmed_operational_percent: number;`, `    coverage_percent: number;\n    live_source_coverage_percent: number;\n    valid_status_count: number;\n    invalid_status_count: number;\n    valid_status_percent: number;\n    confirmed_operational_percent: number;`);
          replaceOnce('src/payloadValidation.ts', `        const numeric = ['active_incident_count', 'affected_provider_count', 'confirmed_operational_count', 'degraded_count', 'major_count', 'unknown_count', 'limited_count', 'unavailable_count', 'disabled_count', 'pending_count', 'stale_count', 'provider_total', 'enabled_provider_count', 'coverage_percent', 'confirmed_operational_percent'];`, `        const numeric = ['active_incident_count', 'affected_provider_count', 'confirmed_operational_count', 'degraded_count', 'major_count', 'unknown_count', 'limited_count', 'unavailable_count', 'disabled_count', 'pending_count', 'stale_count', 'provider_total', 'enabled_provider_count', 'coverage_percent', 'live_source_coverage_percent', 'valid_status_count', 'invalid_status_count', 'valid_status_percent', 'confirmed_operational_percent'];`);
          replaceOnce('src/payloadValidation.ts', `        const enabled = providers.filter(x => x.source_state !== 'disabled');\n        const available = count('source_state', 'available');\n        const expectedCoverage = enabled.length ? Math.round(available / enabled.length * 100) : 0;\n        const expectedOperational = enabled.length ? Math.round(count('service_state', 'operational') / enabled.length * 100) : 0;\n        if (s.enabled_provider_count !== enabled.length || s.coverage_percent !== expectedCoverage || s.confirmed_operational_percent !== expectedOperational)\n            e.push('coverage counts do not reconcile');`, `        const enabled = providers.filter(x => x.source_state !== 'disabled');\n        const available = count('source_state', 'available');\n        const validStatusCount = providers.filter(x => x.status_data_valid === true || ['available', 'limited', 'stale'].includes(String(x.source_state))).length;\n        const expectedCoverage = providers.length ? Math.round(validStatusCount / providers.length * 100) : 0;\n        const expectedLiveSourceCoverage = enabled.length ? Math.round(available / enabled.length * 100) : 0;\n        const expectedOperational = enabled.length ? Math.round(count('service_state', 'operational') / enabled.length * 100) : 0;\n        if (s.enabled_provider_count !== enabled.length || s.coverage_percent !== expectedCoverage || s.live_source_coverage_percent !== expectedLiveSourceCoverage || s.valid_status_count !== validStatusCount || s.invalid_status_count !== providers.length - validStatusCount || s.valid_status_percent !== expectedCoverage || s.confirmed_operational_percent !== expectedOperational)\n            e.push('coverage counts do not reconcile');`);
          replaceOnce('src/__tests__/payloadValidation.test.ts', `const p: any = { schema_version: 2, generated_at: '2026-01-01T00:00:00Z', summary: { service_overall: 'operational', source_overall: 'available', active_incident_count: 0, affected_provider_count: 0, confirmed_operational_count: 1, degraded_count: 0, major_count: 0, unknown_count: 0, limited_count: 0, unavailable_count: 0, disabled_count: 0, pending_count: 0, stale_count: 0, provider_total: 1, enabled_provider_count: 1, coverage_percent: 100, confirmed_operational_percent: 100 }, providers: [{ id: 'a', name: 'A', category: 'C', status: 'ok', color: 'green', service_state: 'operational', source_state: 'available', attention: 'informational', ok: true, source: 'https://a.test', priority: 1 }], incidents: [], changes: [], history: [] };`, `const p: any = { schema_version: 2, generated_at: '2026-01-01T00:00:00Z', summary: { service_overall: 'operational', source_overall: 'available', active_incident_count: 0, affected_provider_count: 0, confirmed_operational_count: 1, degraded_count: 0, major_count: 0, unknown_count: 0, limited_count: 0, unavailable_count: 0, disabled_count: 0, pending_count: 0, stale_count: 0, provider_total: 1, enabled_provider_count: 1, coverage_percent: 100, live_source_coverage_percent: 100, valid_status_count: 1, invalid_status_count: 0, valid_status_percent: 100, confirmed_operational_percent: 100 }, providers: [{ id: 'a', name: 'A', category: 'C', status: 'ok', color: 'green', service_state: 'operational', source_state: 'available', attention: 'informational', ok: true, source: 'https://a.test', priority: 1, status_data_valid: true }], incidents: [], changes: [], history: [] };`);
          replaceOnce('src/__tests__/payloadValidation.test.ts', `test('limited source cannot be counted operational by reconciliation', () => { const x = structuredClone(p); x.providers[0].service_state = 'unknown'; x.providers[0].source_state = 'limited'; assert.equal(isStatusPayload(x), false); });`, `test('valid limited source counts toward provider coverage but not live source coverage', () => { const x = structuredClone(p); x.providers[0].service_state = 'unknown'; x.providers[0].source_state = 'limited'; x.summary.service_overall = 'unknown'; x.summary.source_overall = 'limited'; x.summary.confirmed_operational_count = 0; x.summary.unknown_count = 1; x.summary.limited_count = 1; x.summary.live_source_coverage_percent = 0; x.summary.confirmed_operational_percent = 0; assert.equal(isStatusPayload(x), true); assert.equal(x.summary.coverage_percent, 100); });`);
          replaceOnce('src/__tests__/lifecycle.test.ts', `provider_total: 0, enabled_provider_count: 0, coverage_percent: 0, confirmed_operational_percent: 0`, `provider_total: 0, enabled_provider_count: 0, coverage_percent: 0, live_source_coverage_percent: 0, valid_status_count: 0, invalid_status_count: 0, valid_status_percent: 0, confirmed_operational_percent: 0`);
          replaceOnce('scripts/__tests__/ensure-valid-status.test.js', `  assert.equal(normalized.summary.valid_status_percent, 100);\n  assert.equal(normalized.changes[0].type, 'source_limited');`, `  assert.equal(normalized.summary.valid_status_percent, 100);\n  assert.equal(normalized.summary.coverage_percent, 100);\n  assert.equal(normalized.summary.live_source_coverage_percent, 0);\n  assert.equal(normalized.changes[0].type, 'source_limited');`);
          replaceOnce('scripts/__tests__/ensure-valid-status.test.js', `  assert.equal(normalized.summary.invalid_status_count, 0);\n});\n\ntest('disabled catalog sources fail`, `  assert.equal(normalized.summary.invalid_status_count, 0);\n  assert.equal(normalized.summary.coverage_percent, 100);\n  assert.equal(normalized.summary.live_source_coverage_percent, 100);\n});\n\ntest('disabled catalog sources fail`);
          replaceOnce('.github/workflows/refresh-pages.yml', `          if (summary.valid_status_percent !== 100) failures.push(\`valid_status_percent expected 100, got \${summary.valid_status_percent}\`);`, `          if (summary.valid_status_percent !== 100) failures.push(\`valid_status_percent expected 100, got \${summary.valid_status_percent}\`);\n          if (summary.coverage_percent !== 100) failures.push(\`coverage_percent expected 100, got \${summary.coverage_percent}\`);`);
          NODE

      - name: Bump version to 2.2.0
        run: npm version 2.2.0 --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: Validate release
        run: |
          npm run validate-providers
          npm test
          npm run typecheck
          npm run build:app

      - name: Commit release changes
        shell: bash
        run: |
          rm .github/workflows/apply-provider-coverage-release.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json scripts/ensure-valid-status.mjs scripts/__tests__/ensure-valid-status.test.js src/types.ts src/payloadValidation.ts src/__tests__/payloadValidation.test.ts src/__tests__/lifecycle.test.ts .github/workflows/refresh-pages.yml .github/workflows/apply-provider-coverage-release.yml
          git commit -m "Release 2.2.0 with complete provider coverage"
          git push origin HEAD:agent/provider-coverage-100
