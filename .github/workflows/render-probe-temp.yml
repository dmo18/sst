name: Temporary rendered public page probe
on:
  pull_request:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Render JavaScript status pages
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';

          const chrome = ['/usr/bin/google-chrome', '/usr/bin/google-chrome-stable', '/usr/bin/chromium', '/usr/bin/chromium-browser'].find(fs.existsSync);
          if (!chrome) throw new Error('No Chrome or Chromium executable found on the runner.');

          const urls = {
            ringcentral: 'https://status.ringcentral.com/',
            cove: 'https://uptime.n-able.com/',
            malwarebytes: 'https://status.malwarebytes.com/',
            salesforce: 'https://status.salesforce.com/current',
            zendesk: 'https://status.zendesk.com/',
            backblaze: 'https://status.backblaze.com/',
            eightx8: 'https://status.8x8.com/',
            vultr: 'https://status.vultr.com/'
          };
          const phrasePattern = /all systems operational|all systems normal|all systems are go|operating normally|all services are online|no issues are being reported|no active incidents|no incidents with zendesk|current status available|operational|degraded|outage|incident|normal/gi;
          const results = { chrome, providers: {} };

          for (const [provider, url] of Object.entries(urls)) {
            const run = spawnSync(chrome, [
              '--headless=new', '--disable-gpu', '--no-sandbox', '--disable-dev-shm-usage',
              '--hide-scrollbars', '--virtual-time-budget=12000', '--dump-dom', url
            ], { encoding: 'utf8', timeout: 25000, maxBuffer: 8 * 1024 * 1024 });
            const body = run.stdout || '';
            results.providers[provider] = {
              url,
              status: run.status,
              signal: run.signal,
              error: run.error?.message || '',
              stderr: String(run.stderr || '').slice(-1200),
              bytes: new TextEncoder().encode(body).byteLength,
              title: /<title[^>]*>([\s\S]*?)<\/title>/i.exec(body)?.[1]?.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim() || '',
              phrases: [...new Set((body.match(phrasePattern) || []).map(value => value.toLowerCase()))].slice(0, 30),
              text_sample: body.replace(/<script[\s\S]*?<\/script>/gi, ' ').replace(/<style[\s\S]*?<\/style>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 1200)
            };
          }

          fs.writeFileSync('render-probe.json', `${JSON.stringify(results, null, 2)}\n`);
          console.log(JSON.stringify(results, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: render-probe
          path: render-probe.json
