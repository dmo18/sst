name: Apply Entra test contracts

on:
  push:
    branches:
      - agent/entra-final-reliability
    paths:
      - .github/workflows/apply-entra-test-contracts.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/entra-final-reliability
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/apply-entra-test-contracts.mjs
      - run: npm ci
      - run: npm run validate-providers
      - run: npm test
      - name: Commit test contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/__tests__/update-public-status.test.js
          if git diff --cached --quiet; then
            echo "No test contract diff to commit."
            exit 0
          fi
          git commit -m "Reconcile Entra source reliability tests"
          git push origin HEAD:agent/entra-final-reliability

# Second validation pass includes the source-policy assertion.
