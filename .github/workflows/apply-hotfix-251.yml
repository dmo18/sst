name: Apply 2.5.1 production recovery
on:
  push:
    branches: [agent/production-recovery-250]
permissions:
  contents: write
jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-recovery-250
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply hotfix
        run: node scripts/apply-hotfix-251.mjs
      - name: Synchronize release version and lockfile
        run: npm version 2.5.1 --no-git-tag-version
      - run: npm ci
      - run: npm run validate-providers
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:app
      - name: Verify a live generated payload with both validators
        run: |
          npm run update-status
          npm run validate-browser-payload
          git restore public/status.json 2>/dev/null || true
          rm -f public/previous-status.json
      - name: Verify repository cleanliness and remove one-time tooling
        run: |
          rm .github/workflows/apply-hotfix-251.yml scripts/apply-hotfix-251.mjs
          git diff --check
          test ! -e .github/workflows/apply-hotfix-251.yml
          test ! -e scripts/apply-hotfix-251.mjs
      - name: Commit exact validated recovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release 2.5.1 production payload recovery"
          git push origin HEAD:agent/production-recovery-250
