name: Deploy MSP Status Dashboard
on:
  push:
    branches: [main]
  schedule:
    - cron: "7,19,31,43,55 * * * *"
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      status_description: ${{ steps.verify-status.outputs.description }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run validate-providers
      - name: Run full tests for release-triggered deployments
        if: github.event_name != 'schedule'
        run: npm test
      - name: Run TypeScript checking for release-triggered deployments
        if: github.event_name != 'schedule'
        run: npm run typecheck
      - name: Retrieve prior snapshot (optional)
        run: curl --fail --silent --show-error --max-time 10 https://dmo18.github.io/sst/status.json -o public/previous-status.json || true
      - run: npm run update-status
      - name: Verify browser payload compatibility before deployment
        run: npm run validate-browser-payload
      - name: Verify truthful source coverage and payload freshness
        id: verify-status
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const payload = JSON.parse(fs.readFileSync('public/status.json', 'utf8'));
          const summary = payload.summary || {};
          const providers = payload.providers || [];
          const total = Number(summary.provider_total);
          const valid = Number(summary.valid_status_count);
          const invalid = Number(summary.invalid_status_count);
          const validPercent = Number(summary.valid_status_percent);
          const coverage = Number(summary.coverage_percent);
          const liveSourceCoverage = Number(summary.live_source_coverage_percent);
          const liveSourceCount = Number(summary.live_source_count);
          const fallbackCount = Number(summary.fallback_source_count);
          const generatedAt = Date.parse(payload.generated_at || '');
          const generatedAgeMs = Date.now() - generatedAt;
          const calculatedLiveCount = providers.filter(provider => provider.source_state === 'available' && provider.ok === true).length;
          const calculatedCoverage = total > 0 ? Math.round(calculatedLiveCount / total * 100) : 0;
          const invalidProviders = providers.filter(provider =>
            ['unavailable', 'pending', 'disabled'].includes(provider.source_state)
            || provider.status_data_valid !== true
          );
          const dishonestFallbacks = providers.filter(provider =>
            provider.status_data_basis === 'limited-fallback' && provider.ok === true
          );

          if (!Number.isFinite(generatedAt)) throw new Error('generated_at is invalid');
          if (generatedAgeMs < -300000 || generatedAgeMs > 300000) throw new Error(`generated_at is not fresh: age ${Math.round(generatedAgeMs / 1000)} seconds`);
          if (!Number.isFinite(total) || total <= 0) throw new Error('provider_total is invalid');
          if (valid !== total) throw new Error(`valid_status_count ${valid} does not equal provider_total ${total}`);
          if (invalid !== 0) throw new Error(`invalid_status_count must be zero, received ${invalid}`);
          if (validPercent !== 100) throw new Error(`valid_status_percent must be 100, received ${validPercent}`);
          if (liveSourceCount !== calculatedLiveCount) throw new Error(`live_source_count ${liveSourceCount} does not equal calculated ${calculatedLiveCount}`);
          if (coverage !== calculatedCoverage) throw new Error(`coverage_percent ${coverage} does not equal calculated live coverage ${calculatedCoverage}`);
          if (liveSourceCoverage !== calculatedCoverage) throw new Error(`live_source_coverage_percent ${liveSourceCoverage} does not equal calculated live coverage ${calculatedCoverage}`);
          if (!Number.isFinite(fallbackCount) || fallbackCount < 0) throw new Error(`fallback_source_count is invalid: ${fallbackCount}`);
          if (invalidProviders.length) throw new Error(`Invalid provider status records: ${invalidProviders.map(provider => provider.id).join(', ')}`);
          if (dishonestFallbacks.length) throw new Error(`Fallback records marked successful: ${dishonestFallbacks.map(provider => provider.id).join(', ')}`);

          const description = `${liveSourceCount}/${total} live (${coverage}%); ${fallbackCount} fallback`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `description=${description}\n`);
          console.log(`Truthful coverage and freshness validation passed: ${description}; ${valid}/${total} structurally valid records.`);
          NODE
      - run: npm run build:app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
      statuses: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Smoke-test deployed assets and browser payload
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node --experimental-strip-types scripts/production-smoke.mjs "$PAGE_URL"
      - name: Render deployed page in headless Chrome
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER"
          "$BROWSER" --headless=new --disable-gpu --no-sandbox --virtual-time-budget=20000 --dump-dom "${PAGE_URL}?smoke=${GITHUB_RUN_ID}" > /tmp/live-dom.html
          echo "DOM_BYTES $(wc -c < /tmp/live-dom.html)"
          grep -q 'Technician briefing' /tmp/live-dom.html
          grep -q 'Provider diagnostics and evidence' /tmp/live-dom.html
          ! grep -q 'Status intelligence unavailable' /tmp/live-dom.html
          ! grep -q 'Load failed; no health conclusion is available' /tmp/live-dom.html
      - name: Publish deployed status data verification
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_DESCRIPTION: ${{ needs.build.outputs.status_description }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`;
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
              accept: 'application/vnd.github+json',
              authorization: `Bearer ${process.env.GH_TOKEN}`,
              'content-type': 'application/json',
              'x-github-api-version': '2022-11-28'
            },
            body: JSON.stringify({
              state: 'success',
              context: 'status-data/live-coverage',
              description: process.env.STATUS_DESCRIPTION,
              target_url: `${process.env.PAGE_URL.replace(/\/?$/, '/')}status.json`
            })
          });
          if (!response.ok) throw new Error(`Status publication failed: HTTP ${response.status} ${await response.text()}`);
          console.log(`Published status-data/live-coverage: ${process.env.STATUS_DESCRIPTION}`);
          NODE
