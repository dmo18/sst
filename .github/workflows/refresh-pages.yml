name: Deploy ServiceOps Enterprise Workspace
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [freshness-recovery]
  workflow_dispatch:

concurrency:
  group: pages-release
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status_description: ${{ steps.verify-status.outputs.description }}
      status_state: ${{ steps.verify-status.outputs.state }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run validate-providers
      - name: Run repository quality gates
        if: github.event_name != 'schedule' && github.event_name != 'repository_dispatch'
        run: npm run quality
      - name: Run deterministic tests
        if: github.event_name != 'schedule' && github.event_name != 'repository_dispatch'
        run: npm test
      - name: Run TypeScript checking
        if: github.event_name != 'schedule' && github.event_name != 'repository_dispatch'
        run: npm run typecheck
      - name: Audit complete dependency graph
        if: github.event_name != 'schedule' && github.event_name != 'repository_dispatch'
        run: npm audit --audit-level=high
      - name: Retrieve prior snapshot (optional)
        run: curl --fail --silent --show-error --max-time 10 https://dmo18.github.io/sst/status.json -o public/previous-status.json || true
      - name: Collect and validate public status data without GitHub credentials
        run: env -u GITHUB_TOKEN -u GH_TOKEN npm run update-status
      - name: Verify browser payload compatibility before deployment
        run: npm run validate-browser-payload
      - name: Verify truthful coverage, collection intelligence, and freshness
        id: verify-status
        run: node --experimental-strip-types scripts/verify-release-contract.mjs public/status.json
      - name: Build verified application shell
        if: github.event_name != 'schedule' && github.event_name != 'repository_dispatch'
        run: npm run build:app
      - name: Prepare reusable application shell
        if: github.event_name != 'schedule' && github.event_name != 'repository_dispatch'
        run: |
          rm -rf /tmp/verified-app-shell
          mkdir -p /tmp/verified-app-shell
          cp -a dist/. /tmp/verified-app-shell/
          rm -f /tmp/verified-app-shell/status.json /tmp/verified-app-shell/previous-status.json /tmp/verified-app-shell/deploy-version.txt
      - name: Publish verified application shell
        if: github.event_name != 'schedule' && github.event_name != 'repository_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-app-shell-${{ github.sha }}
          path: /tmp/verified-app-shell
          if-no-files-found: error
          retention-days: 30
      - name: Find verified application shell
        if: github.event_name == 'schedule' || github.event_name == 'repository_dispatch'
        id: shell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const name = `verified-app-shell-${process.env.GITHUB_SHA}`;
          const endpoint = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/artifacts?name=${encodeURIComponent(name)}&per_page=20`;
          const response = await fetch(endpoint, { headers: { accept: 'application/vnd.github+json', authorization: `Bearer ${process.env.GH_TOKEN}`, 'x-github-api-version': '2022-11-28' } });
          if (!response.ok) throw new Error(`Unable to locate verified app shell: HTTP ${response.status} ${await response.text()}`);
          const payload = await response.json();
          const artifact = (payload.artifacts || []).filter(item => !item.expired).sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `found=${Boolean(artifact)}\n`);
          if (artifact) fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${artifact.archive_download_url}\n`);
          console.log(artifact ? `Reusing verified app shell artifact ${artifact.id}.` : `No reusable app shell found for ${process.env.GITHUB_SHA}.`);
          NODE
      - name: Restore verified application shell
        if: (github.event_name == 'schedule' || github.event_name == 'repository_dispatch') && steps.shell.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHELL_URL: ${{ steps.shell.outputs.url }}
        run: |
          rm -rf dist /tmp/verified-app-shell.zip
          mkdir -p dist
          curl --fail --silent --show-error --location --header "Authorization: Bearer ${GH_TOKEN}" --header "X-GitHub-Api-Version: 2022-11-28" "${SHELL_URL}" -o /tmp/verified-app-shell.zip
          unzip -q /tmp/verified-app-shell.zip -d dist
          node scripts/write-deploy-version.mjs
          cp public/status.json public/deploy-version.txt dist/
          test ! -f public/previous-status.json || cp public/previous-status.json dist/previous-status.json
      - name: Fail-safe application build when reusable shell is unavailable
        if: (github.event_name == 'schedule' || github.event_name == 'repository_dispatch') && steps.shell.outputs.found != 'true'
        run: |
          echo "Verified app shell artifact is unavailable; performing a fail-safe build for freshness continuity."
          npm run build:app
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
      statuses: write
    environment:
      name: github-pages
      url: ${{ steps.page-url.outputs.url }}
    steps:
      - name: Deploy Pages, attempt 1
        id: deployment1
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          timeout: 180000
          reporting_interval: 5000
      - name: Back off after first Pages failure
        if: steps.deployment1.outcome == 'failure'
        run: sleep 20
      - name: Deploy Pages, attempt 2
        id: deployment2
        if: steps.deployment1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          timeout: 180000
          reporting_interval: 5000
      - name: Back off after second Pages failure
        if: steps.deployment1.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 40
      - name: Deploy Pages, final attempt
        id: deployment3
        if: steps.deployment1.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          timeout: 600000
          reporting_interval: 10000
      - name: Resolve deployed page URL
        id: page-url
        env:
          URL1: ${{ steps.deployment1.outputs.page_url }}
          URL2: ${{ steps.deployment2.outputs.page_url }}
          URL3: ${{ steps.deployment3.outputs.page_url }}
        run: |
          url="${URL1:-${URL2:-${URL3:-https://dmo18.github.io/sst/}}}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Resolved deployed page URL: $url"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Smoke-test deployed assets, payload, and collection contract
        env:
          PAGE_URL: ${{ steps.page-url.outputs.url }}
        run: |
          for attempt in $(seq 1 10); do
            if node --experimental-strip-types scripts/production-smoke.mjs "$PAGE_URL"; then exit 0; fi
            echo "Production smoke attempt $attempt failed; waiting for Pages propagation."
            sleep 10
          done
          exit 1
      - name: Render deployed enterprise workspace in headless Chrome
        if: github.event_name != 'schedule' && github.event_name != 'repository_dispatch'
        env:
          PAGE_URL: ${{ steps.page-url.outputs.url }}
        run: |
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER"
          for attempt in $(seq 1 4); do
            "$BROWSER" --headless=new --disable-gpu --disable-dev-shm-usage --user-data-dir="/tmp/live-chrome-$attempt" --virtual-time-budget=20000 --dump-dom "${PAGE_URL}?smoke=${GITHUB_RUN_ID}-$attempt" > /tmp/live-dom.html
            if grep -q 'Live dependency table' /tmp/live-dom.html; then break; fi
            sleep 6
          done
          echo "DOM_BYTES $(wc -c < /tmp/live-dom.html)"
          grep -Eo 'Provider operations|Live dependency table|Last browser check|Source reliability|What deserves attention now|Status intelligence unavailable|invalid or unsupported payload[^<]*' /tmp/live-dom.html | head -30 || true
          grep -q 'Provider operations' /tmp/live-dom.html
          grep -q 'Live dependency table' /tmp/live-dom.html
          grep -q 'Last browser check' /tmp/live-dom.html
          grep -q 'Source reliability' /tmp/live-dom.html
          grep -q 'What deserves attention now' /tmp/live-dom.html
          ! grep -q 'Status intelligence unavailable' /tmp/live-dom.html
          ! grep -q 'invalid or unsupported payload' /tmp/live-dom.html
      - name: Resolve published pre-cascade-layer Chromium snapshot
        if: github.event_name != 'schedule' && github.event_name != 'repository_dispatch'
        id: legacy-chromium
        env:
          LEGACY_CHROMIUM_MAX_REVISION: "950365"
        run: node scripts/resolve-legacy-chromium.mjs
      - name: Verify pinned pre-cascade-layer Chromium wallboard runtime
        if: github.event_name != 'schedule' && github.event_name != 'repository_dispatch'
        env:
          PAGE_URL: ${{ steps.page-url.outputs.url }}
          LEGACY_CHROMIUM_REVISION: ${{ steps.legacy-chromium.outputs.revision }}
          LEGACY_CHROMIUM_URL: ${{ steps.legacy-chromium.outputs.url }}
        run: |
          test -n "${LEGACY_CHROMIUM_REVISION}"
          test -n "${LEGACY_CHROMIUM_URL}"
          rm -rf /tmp/chromium-legacy /tmp/chromium-legacy.zip
          curl --fail --silent --show-error --location "${LEGACY_CHROMIUM_URL}" -o /tmp/chromium-legacy.zip
          mkdir -p /tmp/chromium-legacy
          unzip -q /tmp/chromium-legacy.zip -d /tmp/chromium-legacy
          chmod +x /tmp/chromium-legacy/chrome-linux/chrome
          echo "LEGACY_CHROMIUM_REVISION ${LEGACY_CHROMIUM_REVISION}"
          LEGACY_BROWSER=/tmp/chromium-legacy/chrome-linux/chrome STATUS_BASE_URL="$PAGE_URL" node scripts/verify-legacy-wallboard.mjs
      - name: Verify 458x291 Yodeck wallboard contract
        if: github.event_name != 'schedule' && github.event_name != 'repository_dispatch'
        env:
          PAGE_URL: ${{ steps.page-url.outputs.url }}
        run: |
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER"
          export BROWSER
          WALLBOARD_URL="${PAGE_URL%/}/?view=wallboard&alerts=36h&layoutProbe=yodeck&smoke=${GITHUB_RUN_ID}"
          node scripts/verify-yodeck-wallboard.mjs "$WALLBOARD_URL" /tmp/yodeck-wallboard.html /tmp/yodeck-wallboard.png
      - name: Upload Yodeck verification artifacts
        if: github.event_name != 'schedule' && github.event_name != 'repository_dispatch' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yodeck-wallboard-${{ github.run_id }}
          path: |
            /tmp/yodeck-wallboard.html
            /tmp/yodeck-wallboard.png
          if-no-files-found: warn
          retention-days: 7
      - name: Publish deployed intelligence verification
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_DESCRIPTION: ${{ needs.build.outputs.status_description }}
          STATUS_STATE: ${{ needs.build.outputs.status_state }}
          PAGE_URL: ${{ steps.page-url.outputs.url }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`;
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
              accept: 'application/vnd.github+json',
              authorization: `Bearer ${process.env.GH_TOKEN}`,
              'content-type': 'application/json',
              'x-github-api-version': '2022-11-28'
            },
            body: JSON.stringify({
              state: process.env.STATUS_STATE,
              context: 'status-data/live-coverage',
              description: process.env.STATUS_DESCRIPTION,
              target_url: `${process.env.PAGE_URL.replace(/\/?$/, '/')}status.json`
            })
          });
          if (!response.ok) throw new Error(`Status publication failed: HTTP ${response.status} ${await response.text()}`);
          console.log(`Published status-data/live-coverage as ${process.env.STATUS_STATE}: ${process.env.STATUS_DESCRIPTION}`);
          NODE
