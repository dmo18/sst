name: Source diagnostic

on:
  push:
    branches:
      - agent/source-parity-full-review
    paths:
      - .github/workflows/source-diagnostic.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Backblaze static app
        shell: bash
        run: |
          set -e
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const root = 'https://status.backblaze.com/';
          const response = await fetch(root, { signal: AbortSignal.timeout(15000) });
          const html = await response.text();
          console.log(`root status=${response.status} bytes=${Buffer.byteLength(html)}`);
          console.log(html);
          const sources = [...html.matchAll(/<script[^>]+src="([^"]+)"/gi)].map(match => match[1]);
          console.log('script sources', sources);
          const markers = ['firehydrant', 'nunc_connections', '/data/', '/api/', 'incidents', 'components', 'status_page'];
          for (const src of sources) {
            const url = new URL(src, root).href;
            const assetResponse = await fetch(url, { signal: AbortSignal.timeout(15000) });
            const body = await assetResponse.text();
            console.log(`asset ${url} status=${assetResponse.status} bytes=${Buffer.byteLength(body)}`);
            for (const marker of markers) {
              let cursor = 0;
              let count = 0;
              while (count < 12) {
                const index = body.toLowerCase().indexOf(marker.toLowerCase(), cursor);
                if (index < 0) break;
                console.log(`${marker}: ${body.slice(Math.max(0, index - 220), Math.min(body.length, index + 420))}`);
                cursor = index + marker.length;
                count += 1;
              }
            }
          }
          NODE

      - name: Render unresolved official pages
        shell: bash
        run: |
          set +e
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          echo "browser=${BROWSER}"
          for item in \
            'backblaze|https://status.backblaze.com/' \
            'proofpoint|https://proofpoint.my.site.com/community/s/proofpoint-current-incidents' \
            'crowdstrike|https://supportportal.crowdstrike.com/s/' \
            'intermedia|https://exchange.intermedia.net/ControlPanel/Login?ClientType=ControlPanel'; do
            name="${item%%|*}"
            url="${item#*|}"
            echo
            echo "=== render ${name}: ${url} ==="
            timeout 32s "$BROWSER" \
              --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage \
              --user-data-dir="/tmp/source-${name}" \
              --virtual-time-budget=18000 \
              --dump-dom "$url" > "/tmp/${name}.html" 2> "/tmp/${name}.err"
            echo "exit=$? bytes=$(wc -c < /tmp/${name}.html)"
            echo 'stderr:'
            tail -n 10 "/tmp/${name}.err"
            echo 'visible text:'
            node --input-type=module - "$name" <<'NODE'
            import fs from 'node:fs';
            const name = process.argv[2];
            const html = fs.readFileSync(`/tmp/${name}.html`, 'utf8');
            const text = html
              .replace(/<script[\s\S]*?<\/script>/gi, ' ')
              .replace(/<style[\s\S]*?<\/style>/gi, ' ')
              .replace(/<svg[\s\S]*?<\/svg>/gi, ' ')
              .replace(/<[^>]+>/g, ' ')
              .replace(/&nbsp;|&#160;/gi, ' ')
              .replace(/&amp;/gi, '&')
              .replace(/&quot;/gi, '"')
              .replace(/&#39;|&apos;/gi, "'")
              .replace(/\s+/g, ' ')
              .trim();
            console.log(text.slice(0, 16000));
            NODE
          done
