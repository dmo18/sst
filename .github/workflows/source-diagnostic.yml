name: Source diagnostic

on:
  push:
    branches:
      - agent/source-parity-full-review
    paths:
      - .github/workflows/source-diagnostic.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe replacement structured sources
        shell: bash
        run: |
          set +e

          probe() {
            url="$1"
            echo
            echo "=== ${url} ==="
            rm -f /tmp/probe-headers /tmp/probe-body
            curl -L -sS --max-time 15 --http1.1 \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36' \
              -H 'Accept: application/json,text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
              -H 'Accept-Language: en-US,en;q=0.9' \
              -D /tmp/probe-headers \
              -o /tmp/probe-body \
              "${url}"
            rc=$?
            echo "curl_rc=${rc}"
            if [ -f /tmp/probe-headers ]; then
              grep -Ei '^(HTTP/|content-type:|content-length:|server:|location:|x-powered-by:|cf-ray:|via:)' /tmp/probe-headers | tail -n 12
            fi
            if [ -f /tmp/probe-body ]; then
              echo "bytes=$(wc -c < /tmp/probe-body)"
              echo -n 'prefix='
              head -c 1400 /tmp/probe-body | tr '\n\r\t' '   '
              echo
            fi
          }

          urls=(
            'https://status.kaseya.com/api/v2/summary.json'
            'https://status.kaseya.com/api/v2/status.json'
            'https://status.kaseya.com/api/v2/incidents/unresolved.json'
            'https://status.kaseya.com/api/v2/components.json'

            'https://status.lastpass.com/api/v1/status.json'
            'https://status.lastpass.com/api/v1/incidents.json'
            'https://status.lastpass.com/history.rss'

            'https://proofpointsa.statuspage.io/api/v2/summary.json'
            'https://proofpointsa.statuspage.io/api/v2/status.json'
            'https://proofpointsa.statuspage.io/history.rss'

            'https://8x8status.status.page/'
            'https://8x8status.status.page/summary.json'
            'https://8x8status.status.page/status.json'
            'https://8x8status.status.page/components.json'
            'https://8x8status.status.page/unresolved.json'
            'https://8x8status.statuscast.com/'
            'https://8x8status.statuscast.com/summary.json'

            'https://status.backblaze.com/'
            'https://api.firehydrant.io/v1/nunc_connections/6qosk759h9bab'
          )

          for url in "${urls[@]}"; do
            probe "${url}"
          done

          echo
          echo '=== Backblaze script assets ==='
          curl -L -sS --max-time 15 'https://status.backblaze.com/' -o /tmp/backblaze.html
          grep -oE 'src="[^"]+"' /tmp/backblaze.html | sed 's/^src="//;s/"$//' | while read -r src; do
            case "$src" in
              http*) asset="$src" ;;
              /*) asset="https://status.backblaze.com${src}" ;;
              *) asset="https://status.backblaze.com/${src}" ;;
            esac
            echo "--- ${asset}"
            curl -L -sS --max-time 15 "$asset" -o /tmp/backblaze.js
            echo "asset_bytes=$(wc -c < /tmp/backblaze.js)"
            grep -Eo 'https://[^"'"' ]+|/v1/nunc_connections[^"'"' ]*|nunc_connections|firehydrant[^"'"' ]*|status[^"'"' ]*\.json' /tmp/backblaze.js | head -n 80
          done
