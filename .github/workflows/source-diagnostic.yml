name: Source diagnostic

on:
  push:
    branches:
      - agent/source-parity-full-review
    paths:
      - .github/workflows/source-diagnostic.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Probe Backblaze public FireHydrant payload
        shell: bash
        run: |
          set -e
          node --input-type=module <<'NODE'
          const urls = [
            'https://status.backblaze.com/data/payload.json',
            'https://status.backblaze.com/data/rss.xml'
          ];
          for (const url of urls) {
            const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
            const body = await response.text();
            console.log(`=== ${url} ===`);
            console.log(`status=${response.status} type=${response.headers.get('content-type') || ''} bytes=${Buffer.byteLength(body)}`);
            console.log(body.slice(0, 30000));
          }
          NODE

      - name: Render Proofpoint current incidents
        shell: bash
        run: |
          set +e
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          timeout 32s "$BROWSER" --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage --user-data-dir=/tmp/proofpoint-current --virtual-time-budget=18000 --dump-dom 'https://proofpoint.my.site.com/community/s/proofpoint-current-incidents' > /tmp/proofpoint.html 2> /tmp/proofpoint.err
          echo "exit=$? bytes=$(wc -c < /tmp/proofpoint.html)"
          tail -n 15 /tmp/proofpoint.err
          grep -Eio '.{0,250}(Proofpoint Current Incidents|current incidents|no current incidents|all systems|operational|outage|degrad[a-z]*|disruption|investigating|identified|monitoring|resolved|error loading|communication error).{0,500}' /tmp/proofpoint.html | head -n 80 || true

      - name: Probe CrowdStrike official public surfaces
        shell: bash
        run: |
          set +e
          for url in \
            'https://supportportal.crowdstrike.com/s/' \
            'https://supportportal.crowdstrike.com/s/login/' \
            'https://www.crowdstrike.com/en-us/contact-us/' \
            'https://www.crowdstrike.com/en-us/blog/'; do
            echo "=== ${url} ==="
            curl -L -sS --max-time 15 -A 'Mozilla/5.0' -D /tmp/h -o /tmp/b "$url"
            echo "rc=$? bytes=$(wc -c < /tmp/b)"
            grep -Ei '^(HTTP/|content-type:|location:)' /tmp/h | tail -n 8
            grep -Eio '.{0,180}(service status|current incidents|system status|tech alerts|support portal|operating normally|outage|degrad[a-z]*).{0,300}' /tmp/b | head -n 40 || true
          done

      - name: Probe Intermedia official public surfaces
        shell: bash
        run: |
          set +e
          for url in \
            'https://exchange.intermedia.net/ControlPanel/Login?ClientType=ControlPanel' \
            'https://support.intermedia.com/' \
            'https://support.intermedia.com/app/articles/list/kw/System%20Status'; do
            echo "=== ${url} ==="
            curl -L -sS --max-time 15 -A 'Mozilla/5.0' -D /tmp/h -o /tmp/b "$url"
            echo "rc=$? bytes=$(wc -c < /tmp/b)"
            grep -Ei '^(HTTP/|content-type:|location:)' /tmp/h | tail -n 8
            grep -Eio '.{0,180}(system status|service status|global outage|all systems|outage|degrad[a-z]*|control panel|hostpilot).{0,300}' /tmp/b | head -n 60 || true
          done
