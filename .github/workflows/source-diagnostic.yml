name: Source diagnostic

on:
  push:
    branches:
      - agent/source-parity-full-review
    paths:
      - .github/workflows/source-diagnostic.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Backblaze static app
        shell: bash
        run: |
          set +e
          curl -L -sS --max-time 15 'https://status.backblaze.com/' -o /tmp/backblaze.html
          echo '=== Backblaze HTML ==='
          cat /tmp/backblaze.html
          echo
          echo '=== Backblaze JS assets ==='
          grep -oE 'src="[^"]+"' /tmp/backblaze.html | sed 's/^src="//;s/"$//' > /tmp/backblaze-assets.txt
          cat /tmp/backblaze-assets.txt
          while read -r src; do
            [ -n "$src" ] || continue
            case "$src" in
              http*) asset="$src" ;;
              /*) asset="https://status.backblaze.com${src}" ;;
              *) asset="https://status.backblaze.com/${src}" ;;
            esac
            echo "--- ${asset}"
            curl -L -sS --max-time 15 "$asset" -o /tmp/backblaze.js
            echo "asset_bytes=$(wc -c < /tmp/backblaze.js)"
            echo 'firehydrant markers:'
            grep -oE '.{0,180}firehydrant.{0,260}' /tmp/backblaze.js | head -n 25 || true
            echo 'nunc markers:'
            grep -oE '.{0,180}nunc.{0,260}' /tmp/backblaze.js | head -n 25 || true
            echo 'data path markers:'
            grep -oE '.{0,180}/data/.{0,260}' /tmp/backblaze.js | head -n 25 || true
            echo 'api path markers:'
            grep -oE '.{0,180}/api/.{0,260}' /tmp/backblaze.js | head -n 25 || true
          done < /tmp/backblaze-assets.txt

      - name: Render unresolved official pages
        shell: bash
        run: |
          set +e
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          echo "browser=${BROWSER}"
          for item in \
            'backblaze|https://status.backblaze.com/' \
            'proofpoint|https://proofpoint.my.site.com/community/s/proofpoint-current-incidents' \
            'crowdstrike|https://supportportal.crowdstrike.com/s/' \
            'intermedia|https://exchange.intermedia.net/ControlPanel/Login?ClientType=ControlPanel'; do
            name="${item%%|*}"
            url="${item#*|}"
            echo
            echo "=== render ${name}: ${url} ==="
            timeout 35s "$BROWSER" \
              --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage \
              --user-data-dir="/tmp/source-${name}" \
              --virtual-time-budget=20000 \
              --dump-dom "$url" > "/tmp/${name}.html" 2> "/tmp/${name}.err"
            echo "exit=$? bytes=$(wc -c < /tmp/${name}.html)"
            echo 'stderr:'
            tail -n 20 "/tmp/${name}.err"
            echo 'visible text markers:'
            sed -E 's/<script[^>]*>[^<]*<\/script>/ /g; s/<style[^>]*>[^<]*<\/style>/ /g; s/<[^>]+>/ /g; s/&nbsp;/ /g; s/&amp;/\&/g' "/tmp/${name}.html" \
              | tr '\n\r\t' '   ' \
              | sed -E 's/ +/ /g' \
              | head -c 12000
            echo
          done
