name: Branch live provider acceptance

on:
  push:
    branches:
      - agent/final-public-health-conclusions
    paths:
      - .github/workflows/branch-live-acceptance.yml

permissions:
  contents: read

jobs:
  live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-public-health-conclusions
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run validate-providers
      - name: Retrieve prior production snapshot
        run: curl --fail --silent --show-error --max-time 10 https://dmo18.github.io/sst/status.json -o public/previous-status.json || true
      - name: Collect all live providers
        run: npm run update-status
      - name: Validate browser payload
        run: npm run validate-browser-payload
      - name: Enforce full provider acceptance
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { componentStatusIsProblem } from './scripts/source-intelligence.mjs';
          import { isNonServiceAdvisory } from './scripts/incident-classification.mjs';
          import { regionScopeRelevant } from './scripts/region-scope.mjs';

          const payload = JSON.parse(fs.readFileSync('public/status.json', 'utf8'));
          const providers = payload.providers || [];
          const incidents = payload.incidents || [];
          const maintenance = payload.maintenance || [];
          const summary = payload.summary || {};
          const collection = payload.collection || {};
          const failures = [];
          const check = (condition, message) => { if (!condition) failures.push(message); };
          const incidentsFor = provider => incidents.filter(item => item.providerId === provider.id);

          check(providers.length === 79 && Number(summary.provider_total) === 79, `Expected 79 providers, got ${providers.length}/${summary.provider_total}`);
          check(Number(summary.valid_status_count) === 79 && Number(summary.invalid_status_count) === 0 && Number(summary.valid_status_percent) === 100, 'Provider validity is not 79/79 at 100%');
          check(Number(summary.live_source_count) === 79 && Number(summary.coverage_percent) === 100 && Number(summary.live_source_coverage_percent) === 100, `Live source coverage is ${summary.live_source_count}/79 at ${summary.coverage_percent}%`);
          check(Number(summary.fallback_source_count) === 0, `Fallback source count is ${summary.fallback_source_count}`);
          check(Number(summary.limited_source_count) === 0 && Number(summary.unavailable_count) === 0 && Number(summary.pending_count) === 0 && Number(summary.stale_source_count) === 0, 'A provider remains limited, unavailable, pending, or stale');
          check(Number(collection.blind_spot_count) === 0 && Number(summary.blind_spot_count) === 0, `Blind provider coverage remains: ${collection.blind_spot_count}/${summary.blind_spot_count}`);
          check(Number(collection.failed_request_count) === 0 && Number(summary.failed_request_count) === 0, `Failed requests remain: ${collection.failed_request_count}/${summary.failed_request_count}`);
          check(Number(collection.request_count) === Number(collection.successful_request_count), `Request success is ${collection.successful_request_count}/${collection.request_count}`);
          check(Number(summary.request_count) === Number(summary.successful_request_count), `Summary request success is ${summary.successful_request_count}/${summary.request_count}`);

          const nonLive = providers.filter(provider => provider.source_state !== 'available' || provider.ok !== true || provider.status_data_valid !== true);
          check(nonLive.length === 0, `Non-live providers: ${nonLive.map(provider => provider.id).join(', ')}`);
          const badLogs = providers.flatMap(provider => (provider.download_log || []).filter(log => log.ok !== true).map(log => `${provider.id}:${log.url}:${log.status || log.error}`));
          check(badLogs.length === 0, `Failed provider download logs: ${badLogs.join(' | ')}`);
          const fallbacks = providers.filter(provider => provider.status_data_basis === 'limited-fallback');
          check(fallbacks.length === 0, `Fallback provider records: ${fallbacks.map(provider => provider.id).join(', ')}`);

          const unknown = providers.filter(provider => provider.service_state === 'unknown').map(provider => provider.id).sort();
          const expectedUnknown = ['crowdstrike', 'intermedia'];
          check(JSON.stringify(unknown) === JSON.stringify(expectedUnknown), `Unexpected service-state unknown providers: ${unknown.join(', ') || 'none'}`);
          for (const id of expectedUnknown) {
            const provider = providers.find(item => item.id === id);
            check(provider?.health_access === 'authenticated' && provider?.health_observable === false && provider?.source_state === 'available' && provider?.ok === true, `${id} authenticated health contract is not explicit and live`);
          }
          for (const id of ['auth0', 'paypal', 'quickbooks-online', 'stripe']) {
            const provider = providers.find(item => item.id === id);
            check(Boolean(provider && provider.service_state !== 'unknown' && provider.source_state === 'available' && provider.ok === true), `${id} still lacks a live current-health conclusion`);
          }
          const auth0 = providers.find(provider => provider.id === 'auth0');
          check(auth0?.source_type === 'auth0-next-data', `Auth0 source type is ${auth0?.source_type}`);
          check((auth0?.download_log || []).every(log => log.source_type === 'auth0-next-data'), 'Auth0 used browser or fallback transport instead of the server snapshot');
          const quickBooks = providers.find(provider => provider.id === 'quickbooks-online');
          check(quickBooks?.source_type === 'statuspage-json', `QuickBooks source type is ${quickBooks?.source_type}`);

          const affected = providers.filter(provider => ['major', 'degraded'].includes(provider.service_state));
          check(Number(summary.affected_provider_count) === affected.length, `Affected provider count ${summary.affected_provider_count} does not reconcile to ${affected.length}`);
          check(Number(summary.affected_provider_count) === Number(summary.major_count) + Number(summary.degraded_count), 'Affected provider count does not equal major plus degraded counts');
          check(Number(summary.active_incident_count) === incidents.length, `Incident summary ${summary.active_incident_count} does not equal payload ${incidents.length}`);
          check(Number(summary.maintenance_count) === maintenance.length, `Maintenance summary ${summary.maintenance_count} does not equal payload ${maintenance.length}`);

          const countMismatches = providers.flatMap(provider => {
            const actual = incidentsFor(provider).length;
            const embedded = Number(provider.active_incident_count || 0);
            const mismatches = [];
            if (embedded !== actual) mismatches.push(`${provider.id}:${embedded} provider count/${actual} global records`);
            const match = /^(\d+) active (?:US |current )?public incidents?$/.exec(String(provider.status || ''));
            if (match && Number(match[1]) !== actual) mismatches.push(`${provider.id}:${match[1]} label/${actual} global records`);
            return mismatches;
          });
          check(countMismatches.length === 0, `Provider incident counts are stale: ${countMismatches.join(', ')}`);

          const advisoryIncidents = incidents.filter(item => isNonServiceAdvisory(item.title, item.note, item.status));
          check(advisoryIncidents.length === 0, `Non-service advisories remain incidents: ${advisoryIncidents.map(item => `${item.providerId || item.provider}:${item.title}`).join(' | ')}`);

          const entra = providers.find(provider => provider.id === 'entra');
          const entraNotApplicable = (entra?.component_status || []).filter(component => /^(?:not available|n\/?a|not_applicable)$/i.test(String(component.status || '').replace(/_/g, ' ')));
          check(entraNotApplicable.length === 0, `Entra still publishes non-applicable cells: ${entraNotApplicable.map(item => item.name).join(', ')}`);

          for (const id of ['cloudflare', 'elastic-cloud']) {
            const provider = providers.find(item => item.id === id);
            const foreignProblems = (provider?.component_status || []).filter(component => componentStatusIsProblem(component.status) && !regionScopeRelevant(component.name, component.group || '', 'us'));
            check(foreignProblems.length === 0, `${id} has foreign current problem components in US scope: ${foreignProblems.map(item => item.name).join(', ')}`);
          }

          const vultrIncidents = incidents.filter(item => item.providerId === 'vultr');
          const seenVultr = new Set();
          const duplicateVultr = [];
          for (const item of vultrIncidents) {
            const key = [item.title, item.note, item.affected_service || item.affectedService, item.status].map(value => String(value || '').trim().toLowerCase()).join('|');
            if (seenVultr.has(key)) duplicateVultr.push(item.title);
            seenVultr.add(key);
          }
          check(duplicateVultr.length === 0, `Vultr still contains duplicate presentation alerts: ${duplicateVultr.join(', ')}`);

          const calculatedComponentIssues = providers.reduce((sum, provider) => sum + (provider.component_status || []).filter(component => componentStatusIsProblem(component.status)).length, 0);
          check(Number(summary.component_issue_count) === calculatedComponentIssues, `Component issue count ${summary.component_issue_count} does not reconcile to ${calculatedComponentIssues}`);

          console.log(JSON.stringify({
            generated_at: payload.generated_at,
            provider_total: summary.provider_total,
            live_source_count: summary.live_source_count,
            coverage_percent: summary.coverage_percent,
            blind_spot_count: collection.blind_spot_count,
            fallback_source_count: summary.fallback_source_count,
            request_count: collection.request_count,
            successful_request_count: collection.successful_request_count,
            failed_request_count: collection.failed_request_count,
            service_states: { operational: summary.confirmed_operational_count, degraded: summary.degraded_count, major: summary.major_count, unknown: summary.unknown_count },
            unknown_providers: unknown,
            active_incident_count: incidents.length,
            affected_provider_count: affected.length,
            maintenance_count: maintenance.length,
            component_issue_count: calculatedComponentIssues,
            quality_score: collection.quality_score,
            origin_count: collection.origin_count,
            median_request_ms: collection.median_request_ms,
            p95_request_ms: collection.p95_request_ms,
            failures,
            affected_providers: affected.map(provider => ({ id: provider.id, state: provider.service_state, status: provider.status, incident_count: incidentsFor(provider).length }))
          }, null, 2));
          if (failures.length) throw new Error(`Live acceptance failed with ${failures.length} issue(s): ${failures.join(' | ')}`);
          NODE
      - name: Upload live status snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-live-status-${{ github.run_id }}
          path: public/status.json
          if-no-files-found: error
          retention-days: 3
