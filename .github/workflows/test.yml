name: Pull request checks
on:
  pull_request:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply incident detail repair
        run: |
          node scripts/apply-incident-detail-fix.mjs
          node scripts/apply-incident-detail-followup.mjs
          node scripts/apply-incident-live-fix.mjs
          node scripts/apply-nable-record-boundary-fix.mjs
      - name: Commit generated repair
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md package.json package-lock.json scripts/incident-detail-repairs.mjs scripts/public-source-repairs.mjs scripts/update-public-status.mjs scripts/__tests__/update-public-status.test.js
            git commit -m "Separate N-able and Cove records"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - run: npm ci
      - run: npm run validate-providers
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:app
      - name: Audit live incident details
        run: node scripts/audit-live-incident-details.mjs
      - name: Remove temporary repair machinery
        run: |
          cat > .github/workflows/test.yml <<'EOF'
          name: Pull request checks
          on:
            pull_request:
          permissions:
            contents: read
          jobs:
            test:
              runs-on: ubuntu-latest
              timeout-minutes: 8
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: "22"
                    cache: npm
                - run: npm ci
                - run: npm run validate-providers
                - run: npm test
                - run: npm run typecheck
                - run: npm run build:app
          EOF
          rm -f \
            scripts/apply-incident-detail-fix.mjs \
            scripts/apply-incident-detail-followup.mjs \
            scripts/apply-incident-live-fix.mjs \
            scripts/apply-nable-record-boundary-fix.mjs \
            scripts/audit-live-incident-details.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove incident repair helpers"
          git push origin HEAD:${{ github.head_ref }}
