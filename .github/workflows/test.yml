name: Pull request checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run validate-providers
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:app
      - name: Report dependency patch metadata
        run: |
          npm view nanoid@3.3.17 version dist.tarball dist.integrity
          npm view postcss@8.5.23 version dist.tarball dist.integrity
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
