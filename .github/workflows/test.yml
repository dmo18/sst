name: Pull request checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run validate-providers
      - run: npm run quality
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:app
      - name: Audit complete dependency graph
        run: npm audit --audit-level=high
      - name: Inspect all 41 enabled vendors through live official collection
        run: |
          env -u GITHUB_TOKEN -u GH_TOKEN npm run update-status
          node --experimental-strip-types scripts/audit-enabled-providers.mjs public/status.json
