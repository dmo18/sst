name: Pull request checks
on:
  pull_request:
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Integrate v3 pipeline and command center
        run: node scripts/apply-v3-data-pipeline.mjs
      - name: Synchronize 3.0.0 release metadata
        run: npm version 3.0.0 --no-git-tag-version
      - run: npm ci
      - run: npm run validate-providers
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:app
      - name: Generate and validate live first-party payload
        run: |
          npm run update-status
          npm run validate-browser-payload
          npm run build:app
      - name: Verify v3 collection contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('public/status.json', 'utf8'));
          const collection = payload.collection;
          if (!collection || collection.pipeline_version !== '3.0.0') throw new Error('Missing v3 collection contract');
          if (collection.provider_count !== payload.providers.length) throw new Error('Collection provider count mismatch');
          if (collection.request_count !== collection.successful_request_count + collection.failed_request_count) throw new Error('Collection request count mismatch');
          if (collection.healthy_source_count + collection.watch_source_count + collection.blind_spot_count !== payload.providers.length) throw new Error('Collection source-health count mismatch');
          if (!Number.isFinite(collection.quality_score) || collection.quality_score < 0 || collection.quality_score > 100) throw new Error('Invalid collection quality score');
          console.log(`V3_COLLECTION ${collection.run_id} quality=${collection.quality_score} origins=${collection.origin_count} requests=${collection.request_count} healthy=${collection.healthy_source_count} watch=${collection.watch_source_count} blind=${collection.blind_spot_count}`);
          NODE
      - name: Render built command center in headless Chrome
        run: |
          npm run preview -- --port 4173 > /tmp/preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/sst/ >/dev/null && break
            sleep 1
          done
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER"
          for attempt in $(seq 1 3); do
            "$BROWSER" --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage --user-data-dir="/tmp/chrome-v3-$attempt" --virtual-time-budget=15000 --dump-dom "http://127.0.0.1:4173/sst/?smoke=$attempt" > /tmp/v3-dom.html
            if grep -q 'What deserves attention now' /tmp/v3-dom.html; then break; fi
            sleep 2
          done
          echo "DOM_BYTES $(wc -c < /tmp/v3-dom.html)"
          grep -Eo 'Operations command center|Current posture|What deserves attention now|Dependency landscape|Status intelligence unavailable|invalid or unsupported payload[^<]*' /tmp/v3-dom.html | head -30 || true
          grep -q 'Operations command center' /tmp/v3-dom.html
          grep -q 'Current posture' /tmp/v3-dom.html
          grep -q 'What deserves attention now' /tmp/v3-dom.html
          grep -q 'Dependency landscape' /tmp/v3-dom.html
          ! grep -q 'Status intelligence unavailable' /tmp/v3-dom.html
      - name: Prepare and commit validated release candidate
        run: |
          git restore public/status.json 2>/dev/null || true
          rm -f public/previous-status.json scripts/apply-v3-data-pipeline.mjs
          git restore .github/workflows
          git diff --check
          test ! -e scripts/apply-v3-data-pipeline.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release 3.0.0 operations command center"
          git push origin HEAD:${{ github.head_ref }}
