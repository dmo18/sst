name: Deployment run diagnostics
on:
  pull_request:
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Capture recent deployment runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const endpoint = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/runs?per_page=30`;
          const response = await fetch(endpoint, {
            headers: {
              accept: 'application/vnd.github+json',
              authorization: `Bearer ${process.env.GH_TOKEN}`,
              'x-github-api-version': '2022-11-28'
            }
          });
          if (!response.ok) throw new Error(`Actions query failed: HTTP ${response.status} ${await response.text()}`);
          const payload = await response.json();
          const runs = payload.workflow_runs
            .filter(run => run.path === '.github/workflows/refresh-pages.yml' || /Deploy ServiceOps|Deploy MSP Operations/.test(run.name))
            .map(run => ({
              id: run.id,
              name: run.name,
              event: run.event,
              status: run.status,
              conclusion: run.conclusion,
              head_branch: run.head_branch,
              head_sha: run.head_sha,
              run_number: run.run_number,
              created_at: run.created_at,
              updated_at: run.updated_at,
              html_url: run.html_url,
              jobs_url: run.jobs_url
            }));
          fs.writeFileSync('deployment-runs.json', `${JSON.stringify(runs, null, 2)}\n`);
          console.log(JSON.stringify(runs, null, 2));
          NODE
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-runs.json
          git commit -m "Record deployment run diagnostics"
          git push origin HEAD:${{ github.head_ref }}
