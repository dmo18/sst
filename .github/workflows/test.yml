name: Pull request checks
on:
  pull_request:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply structured source release patch
        if: github.head_ref == 'agent/refine-aggregator-research'
        run: node scripts/apply-structured-source-release.mjs
      - name: Commit exact patched branch
        if: github.head_ref == 'agent/refine-aggregator-research'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release 2.4.0 structured status adapters"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - run: npm ci
      - run: npm run validate-providers
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:app
