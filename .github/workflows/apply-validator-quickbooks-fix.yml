name: Apply validator and QuickBooks repair

on:
  push:
    branches:
      - agent/final-public-health-conclusions
    paths:
      - .github/workflows/apply-validator-quickbooks-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-public-health-conclusions
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/apply-validator-quickbooks-fix.mjs
      - run: npm ci
      - run: npm run validate-providers
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:app
      - run: npm audit --omit=dev --audit-level=high
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/providers.json scripts/structured-source-adapters.mjs src/payloadValidation.ts src/__tests__/payloadValidation.test.ts scripts/__tests__/deep-review-regressions.test.js
          git commit -m "Reconcile browser validation and QuickBooks source"
          git push origin HEAD:agent/final-public-health-conclusions
