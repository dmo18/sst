name: Product depth diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  full-suite-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture exact deterministic suite
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/product-depth-tests.log
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-depth-tests-${{ github.run_id }}
          path: /tmp/product-depth-tests.log
          if-no-files-found: error
          retention-days: 1
      - name: Preserve test result
        if: steps.tests.outcome != 'success'
        run: exit 1
