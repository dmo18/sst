name: Apply full review integration

on:
  push:
    branches:
      - agent/source-parity-full-review
    paths:
      - .github/workflows/apply-full-review-integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/source-parity-full-review
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply integration
        run: node scripts/apply-full-review-integration.mjs
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/public-source-repairs.mjs scripts/update-public-status.mjs scripts/__tests__/final-blindspot-repairs.test.js
          if git diff --cached --quiet; then
            echo "No integration diff to commit."
            exit 0
          fi
          git commit -m "Integrate verified full-review source repairs"
          git push origin HEAD:agent/source-parity-full-review
