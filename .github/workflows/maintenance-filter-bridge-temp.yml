name: Temporary maintenance filter bridge
on:
  pull_request:
    paths:
      - .github/maintenance-filter-bridge-trigger
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'agent/filter-scheduled-maintenance-237' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply maintenance filter patch
        run: node scripts/apply-maintenance-filter-temp.mjs
      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate patch
        run: |
          npm ci
          npm run validate-providers
          npm test
          npm run typecheck
          npm run build:app
      - name: Check current Cloudflare output
        run: |
          npm run update-status
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('public/status.json', 'utf8'));
          const incidents = payload.incidents.filter(item => item.providerId === 'cloudflare');
          const falseScheduled = incidents.filter(item => /this is a scheduled event/i.test(`${item.title} ${item.note}`));
          if (falseScheduled.length) throw new Error(`Scheduled Cloudflare event still surfaced: ${falseScheduled.map(item => item.title).join(', ')}`);
          console.log(JSON.stringify({ cloudflare: payload.providers.find(item => item.id === 'cloudflare'), incidents }, null, 2));
          NODE
      - name: Commit production patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/update-public-status.mjs scripts/__tests__/update-public-status.test.js package.json package-lock.json
          git commit -m "Filter scheduled maintenance notices"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
