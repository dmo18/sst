name: Premium product experience verification

on:
  workflow_run:
    workflows: ["Deploy ServiceOps Enterprise Workspace"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: product-experience-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify deployed premium operator experience
        env:
          PAGE_URL: https://dmo18.github.io/sst/
        run: |
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER"
          export BROWSER
          TARGET_URL="${PAGE_URL}?experienceProbe=${GITHUB_RUN_ID}"
          set -o pipefail
          node scripts/verify-operator-experience.mjs "$TARGET_URL" /tmp/operator-experience.html /tmp/operator-experience.png /tmp/operator-command.png /tmp/operator-mobile.png 2>&1 | tee /tmp/operator-experience-verifier.log
          rm -rf /tmp/operator-experience-cdp-* || true
          if find /tmp -maxdepth 1 -name 'operator-experience-cdp-*' -print -quit | grep -q .; then
            echo "Operator browser profile cleanup did not complete." >&2
            exit 1
          fi
          sed -i '/Browser profile cleanup warning/d' /tmp/operator-experience-verifier.log
      - name: Verify deployed product-depth command system
        env:
          PAGE_URL: https://dmo18.github.io/sst/
        run: |
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER"
          export BROWSER
          TARGET_URL="${PAGE_URL}?productDepthProbe=${GITHUB_RUN_ID}"
          set -o pipefail
          node scripts/verify-product-depth-experience.mjs "$TARGET_URL" /tmp/operator-universe.png /tmp/operator-search.png /tmp/operator-incident.png /tmp/operator-universe-mobile.png 2>&1 | tee /tmp/product-depth-verifier.log
          rm -rf /tmp/product-depth-cdp-* || true
          if find /tmp -maxdepth 1 -name 'product-depth-cdp-*' -print -quit | grep -q .; then
            echo "Product-depth browser profile cleanup did not complete." >&2
            exit 1
          fi
          sed -i '/Product-depth browser profile cleanup warning/d' /tmp/product-depth-verifier.log
      - name: Verify deployed Microsoft 365 critical coverage
        env:
          PAGE_URL: https://dmo18.github.io/sst/
        run: |
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER"
          export BROWSER
          TARGET_URL="${PAGE_URL}?m365Probe=${GITHUB_RUN_ID}"
          set -o pipefail
          node scripts/verify-microsoft365-experience.mjs "$TARGET_URL" /tmp/operator-m365.png /tmp/operator-m365-mobile.png 2>&1 | tee /tmp/microsoft365-verifier.log
          rm -rf /tmp/m365-experience-* || true
          if find /tmp -maxdepth 1 -name 'm365-experience-*' -print -quit | grep -q .; then
            echo "Microsoft 365 browser profile cleanup did not complete." >&2
            exit 1
          fi
      - name: Upload product experience evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-experience-${{ github.event.workflow_run.id || github.run_id }}
          path: |
            /tmp/operator-experience.html
            /tmp/operator-experience.png
            /tmp/operator-command.png
            /tmp/operator-mobile.png
            /tmp/operator-universe.png
            /tmp/operator-search.png
            /tmp/operator-incident.png
            /tmp/operator-universe-mobile.png
            /tmp/operator-m365.png
            /tmp/operator-m365-mobile.png
            /tmp/operator-experience-verifier.log
            /tmp/product-depth-verifier.log
            /tmp/microsoft365-verifier.log
          if-no-files-found: warn
          retention-days: 14
