name: Apply full review compatibility

on:
  push:
    branches:
      - agent/source-parity-full-review
    paths:
      - .github/workflows/apply-full-review-compat.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/source-parity-full-review
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply patch
        run: node scripts/apply-full-review-compat.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/full-review-source-adapters.mjs scripts/update-public-status.mjs scripts/collection-intelligence.mjs scripts/ensure-valid-status.mjs src/types.ts scripts/__tests__/provider-source-parity.test.js scripts/__tests__/update-public-status.test.js scripts/__tests__/full-review-source-adapters.test.js
          if git diff --cached --quiet; then
            echo "No patch diff to commit."
            exit 0
          fi
          git commit -m "Finish full-review source compatibility and access semantics"
          git push origin HEAD:agent/source-parity-full-review
