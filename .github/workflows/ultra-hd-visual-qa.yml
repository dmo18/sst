name: Ultra-HD visual QA
on:
  pull_request:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:app
      - name: Start production preview
        run: |
          npm run preview -- --port 4173 > /tmp/preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/sst/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/preview.log
          exit 1
      - name: Render desktop, 4K, and 8K views
        run: |
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER"
          mkdir -p visual-qa
          "$BROWSER" --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage --hide-scrollbars --force-device-scale-factor=1 --window-size=1920,1080 --virtual-time-budget=15000 --screenshot=visual-qa/desktop-1920.png http://127.0.0.1:4173/sst/
          "$BROWSER" --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage --hide-scrollbars --force-device-scale-factor=1 --window-size=3840,2160 --virtual-time-budget=15000 --screenshot=visual-qa/desktop-4k.png http://127.0.0.1:4173/sst/
          "$BROWSER" --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage --hide-scrollbars --force-device-scale-factor=1 --window-size=7680,4320 --virtual-time-budget=15000 --screenshot=visual-qa/desktop-8k.png http://127.0.0.1:4173/sst/
          ls -lh visual-qa
      - uses: actions/upload-artifact@v4
        with:
          name: ultra-hd-visual-qa
          path: visual-qa
          if-no-files-found: error
          retention-days: 1
