name: Temporary lockfile metadata sync
on:
  pull_request:
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Verify synchronized version
        run: node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(l.version!==p.version || l.packages[''].version!==p.version) throw new Error('lockfile version mismatch')"
      - name: Commit lockfile only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git commit -m "Synchronize package lock version"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
