name: Fix and apply deep review repairs

on:
  push:
    branches:
      - agent/final-public-health-conclusions
    paths:
      - .github/workflows/fix-and-apply-deep-review.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-public-health-conclusions
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/fix-deep-review-patch.mjs
      - run: node scripts/apply-deep-review-repairs.mjs
      - run: npm ci
      - run: npm run validate-providers
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:app
      - run: npm audit --omit=dev --audit-level=high
      - name: Commit deep review repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/source-intelligence.mjs scripts/collection-intelligence.mjs scripts/structured-source-adapters.mjs scripts/incident-freshness.mjs scripts/incident-detail-repairs.mjs scripts/entra-status-adapter.mjs scripts/update-public-status.mjs scripts/update-status.mjs scripts/full-review-source-adapters.mjs scripts/__tests__/final-public-health-conclusions.test.js scripts/__tests__/deep-review-regressions.test.js
          git commit -m "Repair source semantics found in full review"
          git push origin HEAD:agent/final-public-health-conclusions
