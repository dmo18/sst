name: Apply Statuspage group scope repair

on:
  push:
    branches:
      - agent/production-invariant-audit
    paths:
      - .github/workflows/apply-statuspage-group-scope.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-invariant-audit
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/apply-statuspage-group-scope.mjs
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Commit scope repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/structured-source-adapters.mjs scripts/__tests__/production-invariant-audit.test.js
          git commit -m "Resolve Statuspage geographic component groups"
          git push origin HEAD:agent/production-invariant-audit
