name: Live production invariant audit

on:
  push:
    branches:
      - agent/production-invariant-audit
    paths:
      - .github/workflows/live-production-invariant-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Collect every live provider
        run: node scripts/update-public-status.mjs
      - name: Enforce status invariants
        run: node scripts/ensure-valid-status.mjs
      - name: Audit generated payload
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { componentStatusIsProblem } from './scripts/source-intelligence.mjs';
          import { regionScopeRelevant } from './scripts/region-scope.mjs';
          const payload = JSON.parse(fs.readFileSync('public/status.json','utf8'));
          const p = payload.providers;
          const s = payload.summary;
          const c = payload.collection;
          const problems = [];
          if (p.length !== 79) problems.push(`provider count ${p.length}`);
          if (s.live_source_count !== 79 || s.live_source_coverage_percent !== 100) problems.push(`live coverage ${s.live_source_count}/${p.length} ${s.live_source_coverage_percent}%`);
          if (s.blind_spot_count !== 0 || s.fallback_source_count !== 0 || s.failed_request_count !== 0) problems.push(`blind/fallback/failed ${s.blind_spot_count}/${s.fallback_source_count}/${s.failed_request_count}`);
          if (c.request_count !== c.successful_request_count || c.failed_request_count !== 0) problems.push(`requests ${c.successful_request_count}/${c.request_count}, failed ${c.failed_request_count}`);
          const unknown = p.filter(x => x.service_state === 'unknown');
          const unexpectedUnknown = unknown.filter(x => !['crowdstrike','intermedia'].includes(x.id));
          if (unexpectedUnknown.length) problems.push(`unexpected unknown ${unexpectedUnknown.map(x=>x.id).join(',')}`);
          for (const id of ['crowdstrike','intermedia']) {
            const item = p.find(x => x.id === id);
            if (!item || item.service_state !== 'unknown' || item.health_access !== 'authenticated' || item.health_observable !== false) problems.push(`${id} auth-gated contract`);
          }
          const futureActive = payload.maintenance.filter(x => x.status === 'in_progress' && Date.parse(x.starts_at || '') > Date.parse(payload.generated_at) + 300000);
          if (futureActive.length) problems.push(`future in-progress maintenance ${futureActive.map(x=>x.id).join(',')}`);
          const expired = payload.maintenance.filter(x => Number.isFinite(Date.parse(x.ends_at || '')) && Date.parse(x.ends_at) < Date.parse(payload.generated_at) - 900000);
          if (expired.length) problems.push(`expired maintenance ${expired.map(x=>x.id).join(',')}`);
          const incidentCounts = new Map();
          for (const x of payload.incidents) incidentCounts.set(x.providerId, (incidentCounts.get(x.providerId) || 0) + 1);
          const countMismatch = p.filter(x => Number(x.active_incident_count || 0) !== Number(incidentCounts.get(x.id) || 0));
          if (countMismatch.length) problems.push(`incident count mismatch ${countMismatch.map(x=>x.id).join(',')}`);
          const foreignProblemComponents = p.flatMap(x => (x.component_status || []).filter(y => componentStatusIsProblem(y.status) && !regionScopeRelevant(y.name, y.group || '', 'us')).map(y => `${x.id}:${y.name}:${y.status}`));
          if (foreignProblemComponents.length) problems.push(`foreign problem components ${foreignProblemComponents.join(',')}`);
          const independentForeignPattern = /\b(?:oceania|middle east|ramallah|palestine|emea|europe|asia pacific|apac|australia|new zealand|singapore|japan|india|brazil|africa|united kingdom|uk)\b/i;
          const independentlyForeignProblems = p.flatMap(x => (x.component_status || []).filter(y => componentStatusIsProblem(y.status) && independentForeignPattern.test(`${y.name || ''} ${y.group || ''}`)).map(y => `${x.id}:${y.name}:${y.group || ''}:${y.status}`));
          if (independentlyForeignProblems.length) problems.push(`independently detected foreign problem components ${independentlyForeignProblems.join(',')}`);
          const untimed = payload.incidents.filter(x => !x.latest_update && !x.first_detected && !x.rawTime && !(x.evidence_basis === 'current-page' && Number.isFinite(Date.parse(x.observed_at || ''))));
          if (untimed.length) problems.push(`unproven untimed incidents ${untimed.map(x=>x.id).join(',')}`);
          const componentOnly = p.filter(x => ['major','degraded'].includes(x.service_state) && Number(x.active_incident_count || 0) === 0 && Number(x.problem_component_count || 0) > 0);
          const wrongBasis = componentOnly.filter(x => x.truth_basis !== 'vendor-component');
          if (wrongBasis.length) problems.push(`component-only wrong truth basis ${wrongBasis.map(x=>x.id).join(',')}`);
          const affected = p.filter(x => ['major','degraded'].includes(x.service_state)).map(x => ({id:x.id,state:x.service_state,status:x.status,truth_basis:x.truth_basis,active_incident_count:x.active_incident_count,problem_component_count:x.problem_component_count,components:(x.component_status||[]).filter(y=>componentStatusIsProblem(y.status))}));
          console.log(JSON.stringify({generated_at:payload.generated_at,summary:s,collection:c,unknown:unknown.map(x=>x.id),affected,incidents:payload.incidents.map(x=>({id:x.id,provider:x.provider,status:x.status,latest_update:x.latest_update,evidence_basis:x.evidence_basis,observed_at:x.observed_at})),in_progress_maintenance:payload.maintenance.filter(x=>x.status==='in_progress').map(x=>({id:x.id,starts_at:x.starts_at,ends_at:x.ends_at})),component_only:componentOnly.map(x=>({id:x.id,truth_basis:x.truth_basis,problem_component_count:x.problem_component_count})),problems},null,2));
          if (problems.length) process.exit(1);
          NODE

# rerun after Statuspage geographic group resolution
