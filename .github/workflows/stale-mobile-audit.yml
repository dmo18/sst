name: Stale data and mobile audit
on:
  pull_request:
permissions:
  contents: write
jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/fix-apply-script.mjs
      - run: node scripts/apply-stale-mobile-fix.mjs
      - run: node scripts/refine-stale-mobile-fix.mjs
      - run: node scripts/prepare-stale-mobile-release.mjs
      - run: npm run validate-providers
      - run: npm test
      - run: npm run typecheck
      - run: npm run update-status
      - run: npm run build:app
      - run: npm audit --audit-level=high
      - name: Audit repaired payload
        run: |
          mkdir -p audit
          python3 - <<'PY'
          import json, datetime, re
          from pathlib import Path
          p=json.loads(Path('public/status.json').read_text())
          now=datetime.datetime.now(datetime.timezone.utc)
          invalid=[]
          for item in p.get('incidents',[]):
              title=str(item.get('title',''))
              selected=next((str(item.get(k)) for k in ('latest_update','rawTime','first_detected') if item.get(k)), '')
              age=None
              if selected:
                  try:
                      dt=datetime.datetime.fromisoformat(selected.replace('Z','+00:00'))
                      if dt.tzinfo is None: dt=dt.replace(tzinfo=datetime.timezone.utc)
                      age=(now-dt.astimezone(datetime.timezone.utc)).total_seconds()/86400
                  except Exception:
                      pass
              if re.search(r'^(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*\s+\d{1,2}\s*,\s*20\d{2}', title, re.I) or (age is not None and age > 45):
                  invalid.append({'provider':item.get('provider'),'title':title,'latest':selected,'age_days':age})
          affected=[provider for provider in p.get('providers',[]) if provider.get('service_state') in ('major','degraded')]
          providers_with_incidents={item.get('providerId') for item in p.get('incidents',[])}
          orphaned=[{'id':provider.get('id'),'name':provider.get('name'),'state':provider.get('service_state'),'status':provider.get('status')} for provider in affected if provider.get('id') not in providers_with_incidents]
          report={'generated_at':p.get('generated_at'),'incidents':len(p.get('incidents',[])),'affected_providers':len(affected),'maintenance':len(p.get('maintenance',[])),'invalid_current_records':invalid,'affected_without_incident':orphaned}
          Path('audit/branch-audit.json').write_text(json.dumps(report, indent=2)+'\n')
          print(json.dumps(report, indent=2))
          if invalid or orphaned: raise SystemExit('Repaired payload still contains stale or unreconciled affected records')
          PY
      - name: Start preview
        run: |
          npm run preview -- --port 4173 > /tmp/preview.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/sst/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/preview.log
          exit 1
      - name: Render phone workspaces
        run: |
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BROWSER"
          for size in 360,800 390,844 430,932; do
            label="${size/,/x}"
            "$BROWSER" --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage --hide-scrollbars --force-device-scale-factor=1 --window-size="$size" --virtual-time-budget=15000 --screenshot="audit/overview-${label}.png" 'http://127.0.0.1:4173/sst/'
          done
          "$BROWSER" --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage --hide-scrollbars --force-device-scale-factor=1 --window-size=390,844 --virtual-time-budget=15000 --screenshot='audit/incidents-390x844.png' 'http://127.0.0.1:4173/sst/?view=incidents'
          "$BROWSER" --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage --hide-scrollbars --force-device-scale-factor=1 --window-size=390,844 --virtual-time-budget=15000 --screenshot='audit/providers-390x844.png' 'http://127.0.0.1:4173/sst/?view=providers'
      - name: Commit exact validated files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/incident-freshness.mjs \
            scripts/update-status.mjs \
            scripts/structured-source-adapters.mjs \
            scripts/incident-detail-repairs.mjs \
            scripts/update-public-status.mjs \
            scripts/__tests__/incident-freshness.test.js \
            src/main.tsx \
            src/styles/mobile-ops.css \
            package.json \
            package-lock.json \
            CHANGELOG.md
          git commit -m "Fix stale incident retention and mobile UX"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
